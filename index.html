<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#f7f1e4" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23e08a2c'/%3E%3Cstop offset='100%25' stop-color='%237c2d12'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='48' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff8ea' font-family='Hind, sans-serif' font-weight='700'%3E%E0%A4%AE%3C/text%3E%3C/svg%3E" />
    <title>Monk Quiz — Test Series</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #f7f1e4;
            --bg-card: #fffdf8;
            --bg-soft: #efe4cd;
            --bg-hover: #f6ecd8;
            --text: #2a1d0f;
            --text-secondary: #6b5a44;
            --text-muted: #9c8a6f;
            --accent: #b45309;
            --accent-soft: rgba(180, 83, 9, 0.09);
            --accent-glow: rgba(180, 83, 9, 0.20);
            --accent-dark: #7c2d12;
            --accent2: #9a3412;
            --green: #15803d;
            --green-soft: rgba(21, 128, 61, 0.12);
            --orange: #b45309;
            --orange-soft: rgba(180, 83, 9, 0.12);
            --red: #b91c1c;
            --red-soft: rgba(185, 28, 28, 0.10);
            --border: #e6d7b8;
            --border-light: #eee1c3;
            --shadow-sm: 0 1px 3px rgba(90, 62, 20, 0.06);
            --shadow-md: 0 4px 18px rgba(90, 62, 20, 0.09);
            --shadow-lg: 0 14px 38px rgba(90, 62, 20, 0.14);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --bottomnav-h: 68px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        html[data-theme="dark"] {
            --bg: #17120a;
            --bg-card: #241b10;
            --bg-soft: #2c2114;
            --bg-hover: #362a19;
            --text: #f5ecd9;
            --text-secondary: #cbb595;
            --text-muted: #8f7c60;
            --accent: #e08a2c;
            --accent-soft: rgba(224, 138, 44, 0.14);
            --accent-glow: rgba(224, 138, 44, 0.22);
            --accent-dark: #b45309;
            --border: #3a2c1a;
            --border-light: #2f2415;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background var(--transition), color var(--transition);
        }
        ::selection {
            background: var(--accent);
            color: #fff;
        }
        button {
            font: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .app-wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 16px 20px calc(var(--bottomnav-h) + 24px);
            position: relative;
            z-index: 1;
        }

        /* ─── bottom nav ─── */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            height: var(--bottomnav-h);
            background: rgba(255, 253, 248, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-light);
            display: flex;
            align-items: stretch;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom, 0);
            transition: background var(--transition), border var(--transition);
        }
        html[data-theme="dark"] .bottom-nav {
            background: rgba(23, 18, 10, 0.94);
            border-top-color: var(--border);
        }
        .bn-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: color var(--transition);
            padding: 6px 0;
            background: transparent;
            position: relative;
        }
        .bn-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: all var(--transition);
        }
        .bn-item.active {
            color: var(--accent);
        }
        .bn-item.active svg {
            transform: translateY(-2px);
        }
        .bn-item .bn-dot {
            position: absolute;
            top: 5px;
            right: 50%;
            transform: translateX(50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        .bn-item.active .bn-dot {
            opacity: 1;
        }
        .bn-item .bn-badge {
            position: absolute;
            top: 4px;
            right: 50%;
            margin-right: -13px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red, #dc2626);
            box-shadow: 0 0 0 2px var(--bg-card, #fff);
            animation: bnBadgePulse 1.8s ease-in-out infinite;
        }
        @keyframes bnBadgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* ─── home nav ─── */
        .home-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 14px 0;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: default;
        }
        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(150deg, var(--accent) 0%, var(--accent-dark) 60%, var(--accent2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            font-family: 'Hind', sans-serif;
            line-height: 1;
            color: #fff8ea;
            box-shadow: 0 4px 14px var(--accent-glow), inset 0 0 0 1.5px rgba(255,255,255,0.18);
            flex-shrink: 0;
            position: relative;
        }
        .logo-mark::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid var(--accent-glow);
            animation: logoRingPulse 2.6s ease-in-out infinite;
        }
        @keyframes logoRingPulse {
            0%, 100% { transform: scale(1); opacity: 0.55; }
            50% { transform: scale(1.1); opacity: 0; }
        }
        .logo-text strong {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.08rem;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, var(--text) 35%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span {
            display: block;
            font-size: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
        }
        .home-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }
        .icon-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .pill-status {
            font-size: 0.5rem;
            font-weight: 600;
            color: var(--green);
            background: var(--green-soft);
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid rgba(22, 163, 74, 0.15);
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .pill-status::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        /* ─── page head ─── */
        .page-head {
            margin-bottom: 20px;
        }
        .page-eyebrow {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-eyebrow::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .page-head h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin: 0 0 2px;
        }
        .page-head p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 400;
            margin: 0;
        }

        /* ─── home hero banner (rotating latest-update photos) ─── */
        .home-hero {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
            min-height: 158px;
            max-height: 158px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 22px;
            padding: 6px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 10px 24px -10px rgba(0,0,0,0.20), 0 20px 40px -18px rgba(0,0,0,0.14);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            transform: translateY(14px) scale(0.985);
            touch-action: pan-y;
        }
        .home-hero.ready { opacity: 1; transform: translateY(0) scale(1); }
        .home-hero:empty { display: none; margin: 0; padding: 0; border: none; box-shadow: none; }
        .home-hero.hh-loading { background: linear-gradient(100deg, var(--bg-soft, #eee) 20%, var(--border-light, #ddd) 40%, var(--bg-soft, #eee) 60%); background-size: 200% 100%; animation: hhShimmer 1.5s ease infinite; }
        @keyframes hhShimmer { 0% { background-position: 120% 0; } 100% { background-position: -20% 0; } }
        .hh-slides { position: absolute; inset: 6px; border-radius: 15px; overflow: hidden; }
        .home-hero-slide {
            position: absolute; inset: 0;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transform: translateY(5px) scale(1.01);
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.35s ease;
        }
        .home-hero-slide.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
            transform: translateY(0) scale(1);
        }
        .home-hero-slide:active img { filter: brightness(0.97); }
        .home-hero-slide img {
            width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
            background: #f7f1e4;
            image-rendering: -webkit-optimize-contrast;
            transition: filter 0.35s ease;
            transform: scale(1.05);
        }
        .home-hero-slide.active img { animation: hhKenBurns 4.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes hhKenBurns { from { transform: scale(1.07); } to { transform: scale(1); } }
        .hh-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); pointer-events: none; }
        .hh-caption {
            position: absolute; left: 12px; right: 12px; bottom: 14px;
            color: #fff; font-size: 0.82rem; font-weight: 800; line-height: 1.35;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.16s,
                        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.16s;
        }
        .home-hero-slide.active .hh-caption { opacity: 1; transform: translateY(0); }
        .hh-tag {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(6px);
            color: #fff; font-size: 0.58rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.05em;
            padding: 4px 10px; border-radius: 20px;
        }
        .home-hero-dots {
            position: absolute; right: 10px; bottom: 8px; left: 10px;
            display: flex; gap: 5px;
            z-index: 3;
        }
        .hh-dot {
            position: relative;
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.28);
            backdrop-filter: blur(2px);
            overflow: hidden;
            cursor: pointer;
            transition: flex-grow 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
        }
        .hh-dot:hover { background: rgba(255,255,255,0.42); }
        .hh-dot.on { flex-grow: 1.6; }
        .hh-dot i {
            position: absolute; inset: 0;
            background: #fff;
            border-radius: 4px;
            transform: scaleX(0);
            transform-origin: left;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        .hh-dot.on i { transform: scaleX(1); transition: transform linear; }
        .hh-dot.done i { transform: scaleX(1); transition: none; }

        /* ─── home news ticker (marquee) ─── */
        .home-ticker-wrap {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .ht-label {
            flex-shrink: 0; font-size: 0.6rem; font-weight: 800;
            color: var(--red); letter-spacing: 0.03em;
        }
        .home-ticker { flex: 1; overflow: hidden; white-space: nowrap; }
        .home-ticker-track {
            display: inline-flex;
            animation: tickerScroll 22s linear infinite;
        }
        .home-ticker-track span {
            font-size: 0.76rem; font-weight: 700; color: var(--text-secondary);
            padding-right: 0; cursor: pointer;
        }
        @keyframes tickerScroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* ─── breadcrumb ─── */
        .crumbs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.68rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding: 0 2px;
        }
        .crumbs a {
            color: var(--text-secondary);
            transition: color var(--transition);
        }
        .crumbs a:hover {
            color: var(--accent);
        }
        .crumbs .sep {
            opacity: 0.25;
            font-weight: 300;
        }
        .crumbs .current {
            color: var(--text);
            font-weight: 600;
        }

        /* ─── grid ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 22px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            opacity: 0;
            transition: opacity var(--transition);
        }
        .card:hover::before {
            opacity: 1;
        }
        .card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .card .card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-xs);
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }
        .card .card-icon svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .card .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }
        .card .badge {
            font-size: 0.52rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 10px;
            border-radius: 30px;
            border: 1px solid var(--accent-glow);
            white-space: nowrap;
        }
        .card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            line-height: 1.25;
        }
        .card .meta {
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .card .meta .dot {
            opacity: 0.3;
        }
        .card .meta svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .card .action {
            margin-top: 4px;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid var(--border-light);
            padding-top: 14px;
            transition: all var(--transition);
        }
        .card .action svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            transition: transform var(--transition);
        }
        .card:hover .action svg {
            transform: translateX(4px);
        }
        .card .progress-mini {
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card .progress-mini .bar {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: var(--border);
            overflow: hidden;
        }
        .card .progress-mini .bar i {
            display: block;
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
        }
        .card .progress-mini span {
            font-size: 0.62rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ─── course card with banner (batch style) ─── */
        .course-card {
            padding: 0 0 18px;
            gap: 0;
        }
        .course-banner-wrap {
            position: relative;
            width: 100%;
            height: 128px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 55%, var(--accent-dark) 100%);
        }
        .course-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .course-banner.ph {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .course-banner.ph span {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff8ea;
        }
        .course-banner.ph span svg {
            width: 24px;
            height: 24px;
        }
        .course-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(20, 14, 5, 0.55);
            color: #fff8ea;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
        }
        .course-body {
            padding: 16px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ─── subject list (step 2) ─── */
        .subject-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .subject-row {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }
        .subject-row:hover {
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }
        .subject-row .sub-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
        }
        .subject-row .sub-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .subject-row-info {
            flex: 1;
            min-width: 0;
        }
        .subject-row-info h3 {
            font-size: 0.98rem;
            font-weight: 700;
            margin: 0;
        }
        .subject-row-info span {
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .subject-row-arrow {
            color: var(--accent);
            flex-shrink: 0;
            display: flex;
        }
        .subject-row-arrow svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        /* ─── test list (step 3) ─── */
        .test-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .test-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }
        .test-item:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .test-item-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .test-item-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .test-item-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .test-info {
            flex: 1;
            min-width: 0;
        }
        .test-info h3 {
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .test-info .test-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .test-info .test-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .test-info .test-meta svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }
        .done-chip {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--green);
            background: var(--green-soft);
            padding: 2px 8px;
            border-radius: 20px;
        }
        .test-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .test-action .price {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }
        .btn-primary {
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            color: #fff8ea;
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.78rem;
            transition: all var(--transition);
            box-shadow: 0 2px 12px var(--accent-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        .btn-block {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 20px;
            font-size: 0.85rem;
        }
        .btn-block svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }
        .btn-secondary {
            background: var(--bg-soft);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.78rem;
            border: 1px solid var(--border-light);
            transition: all var(--transition);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-outline {
            background: transparent;
            color: var(--accent);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.78rem;
            border: 1.5px solid var(--accent);
            transition: all var(--transition);
        }
        .btn-outline:hover {
            background: var(--accent);
            color: #fff;
        }

        /* ─── bookmark star ─── */
        .star-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--bg-soft);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            transition: all var(--transition);
        }
        .star-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: all var(--transition);
        }
        .star-btn:hover { color: var(--accent); border-color: var(--accent); }
        .star-btn.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .star-btn.on svg { fill: var(--accent); }

        /* ─── notes / pdf list ─── */
        .note-item .test-item-icon { background: var(--red-soft); color: var(--red); }
        .read-chip {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 2px 8px;
            border-radius: 20px;
        }
        .notes-hint-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: linear-gradient(135deg, var(--accent-soft), transparent);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .notes-hint-bar:hover { border-color: var(--accent); transform: translateY(-1px); }
        .notes-hint-bar .nhb-text { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 700; }
        .notes-hint-bar .nhb-text svg { width: 18px; height: 18px; stroke: var(--accent); stroke-width: 2; fill: none; flex-shrink: 0; }
        .notes-hint-bar .nhb-count { font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); }

        /* ─── pdf reader ─── */
        .pdf-reader-frame-wrap {
            width: 100%;
            height: 100%;
            border-radius: 0;
            overflow: hidden;
            background: #525659;
        }
        .pdf-reader-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .pdf-loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--bg);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 2;
            transition: opacity 0.3s ease;
        }
        .fs-back-bar .fs-title {
            flex: 1;
            min-width: 0;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 6px;
        }
        .fs-back-bar .fs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .fs-icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: rgba(255,255,255,0.1);
            border: none;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .fs-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; }
        .fs-icon-btn:hover { background: rgba(255,255,255,0.2); }
        .fs-icon-btn.on { background: var(--accent); color: #fff; }
        .fs-icon-btn.on svg { fill: #fff; }
        .pdf-fallback-strip {
            text-align: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            padding: 6px 10px;
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .pdf-fallback-strip a { color: var(--accent); font-weight: 700; text-decoration: none; }

        /* ─── premium channel-style updates feed ─── */
        .news-search-bar {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 11px 14px;
            margin: 4px 0 18px;
            box-shadow: var(--shadow-sm);
        }
        .news-search-bar svg {
            width: 17px; height: 17px; flex-shrink: 0;
            fill: none; stroke: var(--text-muted); stroke-width: 2; stroke-linecap: round;
        }
        .news-search-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-size: 0.84rem; font-weight: 600; color: var(--text-primary);
            font-family: inherit;
        }
        .news-search-bar input::placeholder { color: var(--text-muted); font-weight: 500; }
        .news-search-clear {
            width: 22px; height: 22px; border-radius: 50%; border: none;
            background: var(--bg-alt, rgba(0,0,0,0.06)); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center; font-size: 0.65rem; flex-shrink: 0;
        }
        .news-search-count {
            font-size: 0.68rem; font-weight: 700; color: var(--text-muted);
            padding: 0 2px 2px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .news-feed-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 4px 0 18px;
        }
        .news-feed-head .nf-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 6px 16px var(--accent-glow);
        }
        .news-feed-head .nf-icon i { color: #fff8ea; font-size: 1.05rem; }
        .news-feed-head h2 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
        .news-feed-head p { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
        .news-feed { display: flex; flex-direction: column; gap: 14px; }
        .news-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            animation: fadeSlideUp 0.4s ease both;
            transition: box-shadow var(--transition), transform var(--transition);
        }
        .news-card:active { transform: scale(0.995); }
        .news-card.pinned {
            border-color: var(--accent);
            box-shadow: 0 6px 22px var(--accent-glow);
        }
        .news-card-chan {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px 14px 10px;
        }
        .news-card-chan .nc-avatar {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(145deg, var(--accent), var(--accent-dark));
            color: #fff8ea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 3px 10px var(--accent-glow);
        }
        .news-card-chan .nc-chan-meta { flex: 1; min-width: 0; }
        .news-card-chan .nc-chan-name {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .news-card-chan .nc-chan-name svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--accent); }
        .news-card-date {
            font-size: 0.63rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .nc-save-btn {
            width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            border: 1px solid var(--border-light); background: var(--bg-card);
            color: var(--text-muted); display: flex; align-items: center; justify-content: center;
            transition: all var(--transition);
        }
        .nc-save-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; }
        .nc-save-btn.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .nc-save-btn.on svg { fill: var(--accent); }
        .news-pin-badge {
            font-size: 0.56rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--red), #a11d1d);
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .news-card-media {
            position: relative;
            width: 100%;
            max-height: 340px;
            overflow: hidden;
            background: var(--bg-alt, rgba(0,0,0,0.03));
            cursor: zoom-in;
        }
        .news-card-media img {
            width: 100%;
            height: 100%;
            max-height: 340px;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .news-card-media:active img { transform: scale(1.02); }
        .news-card-title {
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            padding: 12px 16px 0;
            color: var(--text-primary);
        }
        .news-card-body {
            font-size: 0.82rem;
            line-height: 1.65;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: pre-line;
            word-break: break-word;
            padding: 6px 16px 14px;
        }
        .news-card-body b, .news-card-body strong { font-weight: 800; color: var(--text-primary); }
        .news-card-body a { color: var(--accent); font-weight: 700; text-decoration: none; }
        .news-card-body a:hover { text-decoration: underline; }
        .news-empty {
            text-align: center;
            padding: 28px 16px;
            color: var(--text-muted);
            font-size: 0.78rem;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* fullscreen tap-to-zoom lightbox for update photos */
        .news-lightbox {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(10, 8, 4, 0.94);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            animation: fadeSlideUp 0.2s ease both;
            touch-action: pinch-zoom pan-x pan-y;
        }
        .news-lightbox img {
            max-width: 100%; max-height: 100%;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            touch-action: pinch-zoom pan-x pan-y;
        }
        .news-lightbox-close {
            position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.12); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; backdrop-filter: blur(8px);
        }

        /* ─── Daily Quiz CTA + page ─── */
        .daily-quiz-cta {
            display: flex; align-items: center; gap: 14px;
            margin-top: 22px; padding: 16px 18px;
            border-radius: 18px;
            background: linear-gradient(120deg, var(--accent), var(--accent-dark));
            box-shadow: 0 10px 28px var(--accent-glow);
            cursor: pointer;
            transition: transform var(--transition);
        }
        .daily-quiz-cta:active { transform: scale(0.98); }
        .dqc-icon { font-size: 1.9rem; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25)); }
        .dqc-text { flex: 1; }
        .dqc-text h3 { color: #fff8ea; font-size: 0.98rem; font-weight: 800; }
        .dqc-text p { color: rgba(255,248,234,0.85); font-size: 0.72rem; margin-top: 2px; }
        .dqc-arrow svg { width: 18px; height: 18px; stroke: #fff8ea; fill: none; stroke-width: 2.4; }

        .quiz-day-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .quiz-day-head {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 18px;
            background: linear-gradient(120deg, var(--accent), var(--accent-dark));
        }
        .quiz-day-head .qd-emoji { font-size: 1.5rem; }
        .quiz-day-head h2 { color: #fff8ea; font-size: 0.95rem; font-weight: 800; }
        .quiz-day-head p { color: rgba(255,248,234,0.8); font-size: 0.68rem; margin-top: 1px; }
        .quiz-day-body { padding: 20px 18px 22px; }
        .quiz-question { font-size: 0.94rem; font-weight: 700; line-height: 1.55; color: var(--text-primary); margin-bottom: 16px; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-opt {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            border: 1.5px solid var(--border-light);
            border-radius: 13px;
            font-size: 0.83rem; font-weight: 600; color: var(--text-primary);
            background: var(--bg-soft, var(--bg));
            transition: all var(--transition);
            position: relative; overflow: hidden;
        }
        .quiz-opt .qo-letter {
            width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
            background: var(--bg-card); border: 1.5px solid var(--border-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.68rem; font-weight: 800; color: var(--text-muted);
        }
        .quiz-opt:not(.locked):active { transform: scale(0.98); border-color: var(--accent); }
        .quiz-opt.correct { border-color: var(--green, #16a34a); background: var(--green-soft, rgba(22,163,74,0.1)); }
        .quiz-opt.correct .qo-letter { background: var(--green, #16a34a); border-color: var(--green, #16a34a); color: #fff; }
        .quiz-opt.wrong { border-color: var(--red); background: var(--red-soft); }
        .quiz-opt.wrong .qo-letter { background: var(--red); border-color: var(--red); color: #fff; }
        .quiz-opt.locked { pointer-events: none; }
        .quiz-result-banner {
            margin-top: 16px; padding: 12px 14px; border-radius: 13px;
            font-size: 0.8rem; font-weight: 700; text-align: center;
            animation: fadeSlideUp 0.35s ease both;
        }
        .quiz-result-banner.win { background: var(--green-soft, rgba(22,163,74,0.12)); color: var(--green, #16a34a); }
        .quiz-result-banner.lose { background: var(--red-soft); color: var(--red); }
        .quiz-explain { margin-top: 10px; font-size: 0.78rem; line-height: 1.6; color: var(--text-secondary); background: var(--bg-soft, var(--bg)); border-radius: 11px; padding: 10px 12px; }
        .quiz-reattempt-btn { margin-top: 12px; }
        .quiz-score-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .qsb-item { flex: 1; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 14px; padding: 10px 6px; text-align: center; }
        .qsb-item .qsb-num { display: block; font-size: 1.15rem; font-weight: 800; color: var(--text); }
        .qsb-item .qsb-lbl { display: block; font-size: 0.62rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
        .qsb-item.ok .qsb-num { color: var(--green); }
        .qsb-item.bad .qsb-num { color: var(--red); }
        .quiz-nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
        .quiz-nav-count { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
        .btn-outline-small { border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text); font-weight: 700; font-size: 0.74rem; padding: 7px 14px; border-radius: 20px; transition: all var(--transition); }
        .btn-outline-small:hover { border-color: var(--accent); color: var(--accent); }
        .quiz-empty { text-align:center; padding: 40px 20px; color: var(--text-muted); font-size: 0.82rem; }
        .quiz-save-row { display:flex; justify-content:flex-end; margin-top:14px; }

        /* confetti burst on correct answer — pure DOM, no external lib */
        .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 998; overflow: hidden; }
        .confetti-piece {
            position: absolute; top: 45%; left: 50%; font-size: 1.4rem;
            animation: confettiBurst 1.15s cubic-bezier(0.2,0.7,0.3,1) forwards;
        }
        @keyframes confettiBurst {
            0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
        }


        /* ─── test series card (step 1) ─── */
        .series-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            position: relative;
        }
        .series-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .series-card .series-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .series-card .series-header .code {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--orange);
            background: var(--orange-soft);
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }
        .series-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .series-card .series-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .series-card .series-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .series-card .series-stats span {
            background: var(--bg-soft);
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 600;
        }
        .series-card .series-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid var(--border-light);
            padding-top: 14px;
            margin-top: 4px;
        }
        .series-card .series-footer .price {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
        }
        .series-card .series-footer .enroll {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ─── quiz interface — matches TIGERS BATCH admin-panel / exported HTML design exactly ─── */
        .quiz-tb-wrap {
            --tb-navy-950: #0b1220;
            --tb-navy-900: #0f1e33;
            --tb-navy-800: #14284a;
            --tb-tiger-500: #f59e0b;
            --tb-tiger-600: #ea7c17;
            --tb-tiger-700: #c2620b;
            --tb-ink: #1b2333;
            --tb-muted: #64748b;
            --tb-card: #ffffff;
            --tb-line: #e4e8f0;
            --tb-success: #16a34a;
            --tb-success-bg: #dcfce7;
            --tb-danger: #dc2626;
            --tb-danger-bg: #fee2e2;
            font-family: 'Hind', 'Poppins', sans-serif;
            max-width: 800px;
            margin: 0 auto;
        }
        html[data-theme="dark"] .quiz-tb-wrap {
            --tb-ink: #e9eef8;
            --tb-muted: #93a4c3;
            --tb-card: #101b31;
            --tb-line: #22314f;
            --tb-success-bg: rgba(22,163,74,0.16);
            --tb-danger-bg: rgba(220,38,38,0.16);
        }

        /* Brand bar — logo, Telegram, Instagram, mute toggle */
        .quiz-brand-bar {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            background: var(--tb-card); padding: 8px 12px; border-radius: 30px; margin: 0 0 8px;
            box-shadow: 0 2px 10px rgba(15,30,51,0.06); border: 1px solid var(--tb-line);
            font-family: 'Poppins', sans-serif;
        }
        .qb-brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .qb-icon { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; background: linear-gradient(135deg, var(--tb-navy-900), var(--tb-navy-800)); color: var(--tb-tiger-500); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; box-shadow: inset 0 0 0 1px rgba(245,158,11,0.35); }
        .qb-text { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
        .qb-text .qb1 { font-weight: 700; font-size: 0.74rem; color: var(--tb-ink); letter-spacing: 0.2px; white-space: nowrap; }
        .qb-text .qb2 { font-weight: 700; font-size: 0.62rem; color: var(--tb-tiger-600); letter-spacing: 0.6px; white-space: nowrap; }
        .qb-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
        .qb-telegram, .qb-instagram { font-size: 0.72rem; font-weight: 600; border-radius: 18px; padding: 6px 12px; text-decoration: none !important; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.2s; }
        .qb-telegram { background: linear-gradient(135deg, #0088cc, #24A1DE); color: #fff !important; }
        .qb-telegram:hover { box-shadow: 0 3px 10px rgba(36,161,222,0.35); transform: translateY(-1px); }
        .qb-instagram { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4); color: #fff !important; }
        .qb-instagram:hover { box-shadow: 0 3px 10px rgba(221,42,123,0.35); transform: translateY(-1px); }
        .qb-mute { flex: 0 0 auto; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--tb-card); color: var(--tb-ink); border: 1px solid var(--tb-line); transition: transform 0.2s; }
        .qb-mute:hover { transform: rotate(15deg); }
        @media (max-width: 480px) {
            .qb-text .qb1 { font-size: 0.66rem; } .qb-text .qb2 { font-size: 0.56rem; }
            .qb-icon { width: 26px; height: 26px; font-size: 0.72rem; }
            .qb-telegram { padding: 5px 9px; font-size: 0.66rem; }
        }
        @media (max-width: 390px) { .qb-instagram span { display: none; } }
        @media (max-width: 360px) { .qb-telegram span { display: none; } }

        /* Single configurable watermark */
        .quiz-watermark {
            position: fixed; z-index: 5; font-family: 'Poppins', sans-serif; font-weight: 700;
            letter-spacing: 2px; white-space: nowrap; pointer-events: none; user-select: none;
            transform: translate(-50%, -50%) rotate(-28deg); color: #6e7a96;
        }

        .quiz-container {
            background: linear-gradient(180deg, rgba(245,158,11,0.07) 0%, var(--tb-card, var(--bg-card)) 180px);
            border: 1px solid var(--tb-line, var(--border-light));
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(15,30,51,0.14);
            overflow: hidden;
            animation: fadeIn 0.35s ease-out;
            max-width: 800px;
            margin: 0 auto;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes pulseWarn { 0%,100%{opacity:1} 50%{opacity:0.7} }

        /* Reading-controls toolbar — question counter + font/bold stepper, sticky under the brand bar */
        .quiz-toolbar {
            position: sticky; top: 0; z-index: 40;
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 10px 14px; margin: 0 0 2px;
            background: rgba(255,255,255,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--tb-line);
        }
        html[data-theme="dark"] .quiz-toolbar { background: rgba(16,27,49,0.78); }
        .quiz-toolbar .qt-counter {
            font-size: 0.7rem; font-weight: 700; color: var(--tb-navy-800); background: rgba(15,30,51,0.06);
            padding: 5px 11px; border-radius: 20px; letter-spacing: 0.2px; white-space: nowrap; font-family: 'Poppins', sans-serif;
        }
        html[data-theme="dark"] .quiz-toolbar .qt-counter { color: #e9eef8; background: rgba(255,255,255,0.08); }
        .quiz-toolbar .qt-controls { display: flex; align-items: center; gap: 4px; background: var(--tb-card); border: 1px solid var(--tb-line); border-radius: 20px; padding: 3px; }
        .quiz-toolbar .qt-controls button {
            font-size: 0.68rem; font-weight: 700; padding: 4px 10px; border-radius: 16px; border: none;
            color: var(--tb-ink); background: transparent; transition: all 0.18s ease; line-height: 1.4;
        }
        .quiz-toolbar .qt-controls button:hover { background: rgba(245,158,11,0.14); }
        .quiz-toolbar .qt-controls button.active { background: var(--tb-tiger-500); color: #fff; box-shadow: 0 2px 8px rgba(245,158,11,0.35); }
        .quiz-toolbar .qt-controls .qt-sep { width: 1px; height: 16px; background: var(--tb-line); margin: 0 1px; }


        .quiz-question { padding: 12px 16px 0; }
        .quiz-question .q-text { font-size: 0.88rem; line-height: 1.5; margin-bottom: 10px; color: var(--tb-ink); font-family: 'Hind', 'Poppins', sans-serif; font-weight: 600; white-space: pre-line; }
        .q-image-wrap { margin: -2px 0 14px; border-radius: 12px; overflow: hidden; border: 1px solid var(--tb-line); background: #f4f6fb; max-width: 100%; }
        .q-image-wrap img { display: block; max-width: 100%; max-height: 340px; margin: 0 auto; cursor: zoom-in; }

        /* Options — opt-letter badges, thumb-friendly */
        .quiz-options { display: flex; flex-direction: column; gap: 8px; }
        .quiz-options .option {
            text-align: left; padding: 10px 12px; border-radius: 12px; transition: all 0.18s ease;
            position: relative; overflow: hidden; border: 1.5px solid var(--tb-line);
            font-size: 0.82rem; font-family: 'Hind', 'Poppins', sans-serif; font-weight: 500;
            background: var(--tb-card); min-height: 42px; display: flex; align-items: center; gap: 9px;
            cursor: pointer; color: var(--tb-ink); box-shadow: 0 1px 2px rgba(15,30,51,0.04);
        }
        .quiz-options .option:hover { background-color: #f7fafc; border-color: #c7d0e0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,30,51,0.08); }
        html[data-theme="dark"] .quiz-options .option:hover { background-color: #132038; border-color: #2c4370; }
        .quiz-options .option:active { transform: scale(0.99); }
        .quiz-options .option .letter {
            display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
            border-radius: 7px; background: #eef2f9; color: var(--tb-navy-800); font-weight: 700; font-size: 0.72rem;
            flex: 0 0 auto; transition: all 0.15s ease;
        }
        .quiz-options .option .label { font-size: 0.86rem; font-weight: 500; flex: 1; }
        .quiz-options .option .radio { display: none; }
        .quiz-options .option.selected { animation: optPulse 0.3s ease; background-color: #fff7ec; border-color: var(--tb-tiger-500); font-weight: 600; color: var(--tb-tiger-700); box-shadow: 0 2px 10px rgba(245,158,11,0.18); }
        @keyframes optPulse { 0%{ transform:scale(0.98); } 60%{ transform:scale(1.01); } 100%{ transform:scale(1); } }
        .quiz-options .option.selected .letter { background: var(--tb-tiger-500); color: #fff; }
        .quiz-options .option.correct { background-color: var(--tb-success-bg) !important; border-color: var(--tb-success) !important; color: #14532d !important; font-weight: 600; }
        .quiz-options .option.correct .letter { background: var(--tb-success) !important; color: #fff !important; }
        .quiz-options .option.incorrect { background-color: var(--tb-danger-bg) !important; border-color: var(--tb-danger) !important; color: #7f1d1d !important; }
        .quiz-options .option.incorrect .letter { background: var(--tb-danger) !important; color: #fff !important; }
        .quiz-options .option.disabled { cursor: default; }

        .quiz-explanation { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #f6f8fc; border-left: 3px solid var(--tb-navy-800); font-size: 0.8rem; line-height: 1.45; font-family: 'Hind', 'Poppins', sans-serif; white-space: pre-line; }
        html[data-theme="dark"] .quiz-explanation { background: #0d1729; }
        .quiz-explanation b { color: var(--tb-tiger-600); }

        /* Question palette — single scrollable row */
        .quiz-palette { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 10px 16px; margin: 0; scroll-behavior: smooth; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        .qp-box {
            flex: 0 0 auto; width: 29px; height: 29px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 700; border: 1px solid var(--tb-line);
            background: #f4f6fb; color: #5b6578; cursor: pointer; transition: all 0.18s ease; position: relative;
        }
        html[data-theme="dark"] .qp-box { background: #0d1729; color: var(--tb-ink); }
        .qp-box:hover { border-color: var(--tb-tiger-500); }
        .qp-box.current { background: linear-gradient(135deg, var(--tb-navy-900), var(--tb-navy-800)); border-color: var(--tb-navy-900); color: #fff; transform: scale(1.12); }
        .qp-box.answered { background-color: #fff2dc; border-color: var(--tb-tiger-500); color: var(--tb-tiger-700); }
        html[data-theme="dark"] .qp-box.answered { background-color: rgba(245,158,11,0.14); }
        .qp-box.bookmarked { box-shadow: 0 0 0 2px var(--tb-tiger-600) inset; }
        .qp-box.correct { background-color: var(--tb-success); border-color: var(--tb-success); color: #fff; }
        .qp-box.incorrect { background-color: var(--tb-danger); border-color: var(--tb-danger); color: #fff; }

        /* Sticky bottom action bar — Flag / Prev / Next / Submit */
        .quiz-actionbar {
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
            position: sticky; bottom: 0; z-index: 5;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--tb-card) 32%);
            padding: 10px 16px 14px;
        }
        .bookmark-toggle {
            font-size: 0.75rem; font-weight: 600; padding: 7px 12px; border-radius: 20px;
            border: 1.5px solid var(--tb-tiger-500); color: var(--tb-tiger-700); background: transparent;
            display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.18s ease;
        }
        .bookmark-toggle:hover, .bookmark-toggle.active { background: var(--tb-tiger-500); border-color: var(--tb-tiger-500); color: #fff; }
        .quiz-actionbar .nav-btns { display: flex; gap: 6px; }
        .quiz-actionbar .nav-btns button { padding: 7px 12px; font-size: 0.78rem; border-radius: 20px; font-weight: 600; border: 1.5px solid var(--tb-navy-900); color: var(--tb-navy-900); background: transparent; white-space: nowrap; transition: all 0.18s ease; }
        html[data-theme="dark"] .quiz-actionbar .nav-btns button { color: var(--tb-ink); border-color: var(--tb-line); }
        .quiz-actionbar .nav-btns button:hover:not(:disabled) { background: var(--tb-navy-900); color: #fff; border-color: var(--tb-navy-900); }
        .quiz-actionbar .submit-btn {
            background: linear-gradient(135deg, var(--tb-navy-900), var(--tb-navy-800)); color: #fff; border: none;
            padding: 8px 20px; border-radius: 22px; font-weight: 700; font-size: 0.8rem;
            box-shadow: 0 4px 14px rgba(15,30,51,0.28); transition: all 0.18s ease; white-space: nowrap;
        }
        .quiz-actionbar .submit-btn:hover { background: var(--tb-navy-950); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,30,51,0.35); }

        @media (max-width: 480px) {
            .quiz-question .q-text { font-size: 0.82rem; line-height: 1.42; }
            .quiz-options .option { padding: 9px 10px; font-size: 0.78rem; min-height: 38px; }
            .quiz-options .option .letter { width: 19px; height: 19px; font-size: 0.68rem; }
            .qp-box { width: 26px; height: 26px; font-size: 0.66rem; }
            .bookmark-toggle span, .quiz-actionbar .nav-btns button span { display: none; }
            .bookmark-toggle, .quiz-actionbar .nav-btns button { padding: 7px 10px; }
        }

        /* ─── result panel ─── */
        .result-panel { text-align: center; padding: 22px 20px 24px; }
        .result-score {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 6px 0 2px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .result-sub {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 18px;
        }
        .result-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 480px;
            margin: 0 auto 20px;
            text-align: center;
        }
        .result-stat {
            background: var(--bg-soft);
            border-radius: var(--radius-sm);
            padding: 12px 6px;
        }
        .result-stat b { display: block; font-size: 1.15rem; font-weight: 800; }
        .result-stat span { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
        .result-stat.green b { color: var(--green); }
        .result-stat.red b { color: var(--red); }
        .result-stat.orange b { color: var(--orange); }
        .result-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 20px;
            text-align: left;
        }
        .result-charts .chart-box {
            background: var(--bg-soft);
            border-radius: var(--radius-sm);
            padding: 14px;
            height: 190px;
        }
        .result-charts h6 {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .result-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .result-actions button, .result-actions a {
            padding: 9px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.8rem;
        }
        .btn-review { background: var(--text); color: var(--bg); }
        .btn-review:hover { transform: translateY(-2px); }
        .btn-back { background: var(--bg-soft); color: var(--text-secondary); border: 1px solid var(--border-light); }

        .quiz-loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .quiz-loading .spinner,
        .pdf-loading-overlay .spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .html-test-frame-wrap {
            border-radius: var(--radius, 16px);
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 26px rgba(15,30,51,0.1);
            background: #fff;
            height: 78vh;
            min-height: 480px;
        }
        .html-test-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        @media (max-width: 640px) {
            .html-test-frame-wrap { height: 72vh; border-radius: var(--radius-sm, 12px); }
        }

        /* ── Fullscreen HTML test mode: hide the rest of the app chrome, show only the test frame ── */
        body.fullscreen-test-mode .home-nav,
        body.fullscreen-test-mode .app-footer,
        body.fullscreen-test-mode .bottom-nav {
            display: none !important;
        }
        body.fullscreen-test-mode .app-wrap {
            max-width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
        }
        body.fullscreen-test-mode #content {
            padding: 0 !important;
            margin: 0 !important;
        }
        body.fullscreen-test-mode {
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .html-test-frame-wrap.fullscreen {
            height: calc(100vh - 44px);
            height: calc(100dvh - 44px);
            border-radius: 0;
            border: none;
            box-shadow: none;
        }
        .html-test-frame-wrap.fullscreen.pdf-mode {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .html-test-frame-wrap.fullscreen.pdf-mode .pdf-reader-frame-wrap {
            flex: 1;
            min-height: 0;
        }
        .fs-back-bar {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 14px;
            background: #0f1b33;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .fs-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 6px 14px 6px 10px;
            font-size: 0.76rem;
            font-weight: 700;
        }
        .fs-back-btn:active { transform: scale(0.96); }

        @media (max-width: 480px) {
            .result-stats-grid { grid-template-columns: repeat(2, 1fr); }
            .result-charts { grid-template-columns: 1fr; }
        }

        /* ─── toast ─── */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--bottomnav-h) + 20px);
            transform: translate(-50%, 16px);
            z-index: 130;
            background: var(--text);
            color: var(--bg);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
            max-width: 86%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ─── footer ─── */
        .app-footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 0.62rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .app-footer strong {
            color: var(--accent);
