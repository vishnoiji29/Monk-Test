    <script>
        /* ─── CONFIG ─── */
        const GITHUB_USER = "vishnoiji29";
        const GITHUB_REPO = "Monk-Test";
        const GITHUB_BRANCH = "main";
        const ROOT_FOLDER = "courses";
        const NEWS_FOLDER = "news";
        const QUIZ_FOLDER = "daily-quiz";
        const HOME_CONFIG_PATH = "site-config/home.json";
        const PDF_EXT_RE = /\.pdf$/i;
        function pdfViewerUrl(path) {
            // Google's document viewer, pointed at the raw GitHub file — this is the version that
            // was confirmed working before: it has its own zoom in/out controls and doesn't depend
            // on the visiting browser having a built-in PDF engine (many in-app/WebView browsers
            // don't, which is why direct-streaming attempts showed a blank white screen).
            return `https://docs.google.com/viewer?embedded=true&url=` + encodeURIComponent(rawUrl(path));
        }

        const ICON_COURSE =
            `<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
        const ICON_SUBJECT =
            `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>`;
        const ICON_TEST =
            `<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;
        const ICON_NOTE =
            `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>`;
        const ICON_CHEVRON =
            `<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
        const ICON_CLOCK =
            `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
        const ICON_QUESTION =
            `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
        const ICON_STAR =
            `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

        const SUN_SVG =
            `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
        const MOON_SVG =
            `<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>`;

        const store = {
            _mem: {},
            get(key, fallback) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw === null ? fallback : JSON.parse(raw);
                } catch { return (key in this._mem) ? this._mem[key] : fallback; }
            },
            set(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch { this._mem[key] = value; }
            }
        };

        let courses = {};
        let loaded = false;
        let loadErr = null;
        let newsFiles = [];
        let newsCache = null;
        let newsLoading = false;
        let quizFiles = [];
        let homeConfig = null; // { banner: [{image, caption}], ticker: [strings] } — set by the admin, independent of news posts

        function getBookmarks() { return store.get('mt_bookmarks', {}); }

        function isBookmarked(path) { return !!getBookmarks()[path]; }

        function toggleBookmark(path, meta) {
            const b = getBookmarks();
            if (b[path]) delete b[path];
            else if (meta) b[path] = meta;
            store.set('mt_bookmarks', b);
            return !!b[path];
        }

        function getAttempted() { return store.get('mt_attempted', {}); }

        function markAttempted(path) {
            const a = getAttempted();
            if (!a[path]) { a[path] = true;
                store.set('mt_attempted', a);
                addXP(10); }
        }

        function getReadNotes() { return store.get('mt_notes_read', {}); }

        function markNoteRead(path) {
            const r = getReadNotes();
            if (!r[path]) { r[path] = true;
                store.set('mt_notes_read', r);
                addXP(5); }
        }

        function getXP() { return store.get('mt_xp', 0); }

        function addXP(n) { store.set('mt_xp', getXP() + n); }

        function getLevel(xp) { return Math.floor(xp / 100) + 1; }

        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function updateStreak() {
            const s = store.get('mt_streak', { count: 0, last: null });
            const today = todayStr();
            if (s.last === today) return s;
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            s.count = (s.last === yesterday) ? s.count + 1 : 1;
            s.last = today;
            store.set('mt_streak', s);
            return s;
        }

        function getRecents() { return store.get('mt_recents', []); }

        function pushRecent(meta) {
            let r = getRecents().filter(x => x.path !== meta.path);
            r.unshift(Object.assign({}, meta, { ts: Date.now() }));
            r = r.slice(0, 8);
            store.set('mt_recents', r);
        }

        function toast(msg) {
            const t = document.getElementById('toastEl');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                "'": '&#39;' }[c])); }

        // Safe to drop inside a single-quoted onclick='...' HTML attribute — JSON.stringify alone
        // doesn't escape apostrophes, so free-text titles/questions containing one (very common in
        // Hindi/English news headlines) would otherwise break out of the attribute early.
        function jsAttr(value) { return JSON.stringify(value).replace(/'/g, '\\u0027'); }

        function cleanQText(s) {
            // Defensive: strip an already-embedded leading question number so it never doubles with the auto-added "Qn."
            let out = String(s || '').trim();
            let prev;
            do {
                prev = out;
                out = out.replace(/^(प्रश्न|Question|Q)\.?\s*\d+\s*[.):।-]?\s*/i, '').trim();
                out = out.replace(/^\d+\s*[.):।-]\s*/, '').trim();
            } while (out !== prev);
            return out;
        }

        function toTitle(name) {
            return name.replace(/\.html?$/i, '').replace(/\.pdf$/i, '').replace(/\.json$/i, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c
            .toUpperCase());
        }

        function rawUrl(path) {
            // raw.githubusercontent.com serves fresh content (light/short caching), unlike jsDelivr's
            // long CDN cache — this ensures test edits/deletes show up on the site right away.
            return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/` + path.split('/').map(
                encodeURIComponent).join('/');
        }

        function htmlEmbedUrl(path) {
            // raw.githubusercontent.com serves everything as text/plain, so an .html file won't render
            // inside an <iframe> from there — jsDelivr serves the correct text/html content-type instead.
            return `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${GITHUB_BRANCH}/` + path.split('/').map(
                encodeURIComponent).join('/');
        }

        async function fetchTree() {
            const url =
                `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1&_=${Date.now()}`;
            const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
            if (!res.ok) throw { status: res.status };
            return res.json();
        }

        const IMG_EXT_RE = /\.(png|jpe?g|webp|gif|avif)$/i;

        function buildStructure(tree) {
            const files = (tree.tree || []).filter(f => f.type === 'blob' && f.path.startsWith(ROOT_FOLDER + '/'));
            const out = {};
            const courseBannerCandidates = {};
            const subjectIconCandidates = {};
            files.forEach(f => {
                const rel = f.path.slice(ROOT_FOLDER.length + 1);
                const parts = rel.split('/');
                const fileName = parts[parts.length - 1];

                // course-level cover image, e.g. courses/SI Tiger Batch/cover.jpg
                if (parts.length === 2 && IMG_EXT_RE.test(fileName)) {
                    const courseName = parts[0];
                    courseBannerCandidates[courseName] = courseBannerCandidates[courseName] || [];
                    courseBannerCandidates[courseName].push(f.path);
                    return;
                }

                // subject-level round icon, e.g. courses/SI Tiger Batch/Hindi/icon.jpg
                if (parts.length === 3 && IMG_EXT_RE.test(fileName)) {
                    const courseName = parts[0], subjectName = parts[1];
                    const key = courseName + '\u0000' + subjectName;
                    subjectIconCandidates[key] = subjectIconCandidates[key] || [];
                    subjectIconCandidates[key].push(f.path);
                    return;
                }

                if (parts.length < 4) return;
                const courseName = parts[0];
                const subjectName = parts[1];
                const sectionRaw = parts[2].toLowerCase();
                if (!/\.(html?|pdf|json)$/i.test(fileName)) return;
                const sectionKey = sectionRaw.includes('note') ? 'notes' : 'tests';
                out[courseName] = out[courseName] || { subjects: {}, banner: null };
                out[courseName].subjects[subjectName] = out[courseName].subjects[subjectName] || { tests: [],
                    notes: [], icon: null };
                out[courseName].subjects[subjectName][sectionKey].push({
                    name: toTitle(fileName),
                    path: f.path,
                    ext: fileName.split('.').pop().toLowerCase()
                });
            });
            Object.keys(courseBannerCandidates).forEach(courseName => {
                out[courseName] = out[courseName] || { subjects: {}, banner: null };
                const candidates = courseBannerCandidates[courseName];
                const preferred = candidates.find(p => /(cover|banner|thumb|thumbnail)/i.test(p));
                out[courseName].banner = rawUrl(preferred || candidates[0]);
            });
            Object.keys(subjectIconCandidates).forEach(key => {
                const [courseName, subjectName] = key.split('\u0000');
                if (!out[courseName] || !out[courseName].subjects[subjectName]) return;
                const candidates = subjectIconCandidates[key];
                const preferred = candidates.find(p => /(icon|avatar|logo)/i.test(p));
                out[courseName].subjects[subjectName].icon = rawUrl(preferred || candidates[0]);
            });
            Object.values(out).forEach(course => {
                course.banner = course.banner || null;
                Object.values(course.subjects).forEach(subj => {
                    subj.icon = subj.icon || null;
                    subj.tests.sort((a, b) => a.name.localeCompare(b.name));
                    subj.notes.sort((a, b) => a.name.localeCompare(b.name));
                });
            });
            return out;
        }

        // ── News/updates channel: any .txt / .md / .json file dropped in news/ becomes a post.
        // Filenames like "2026-08-11-exam-date-out.txt" get their date + title parsed from the name;
        // otherwise the file's own content (or repo order) decides title/order.
        function collectNews(tree) {
            const files = (tree.tree || []).filter(f => f.type === 'blob' && f.path.startsWith(NEWS_FOLDER + '/') &&
                /\.(txt|md|json)$/i.test(f.path));
            return files.map(f => {
                const fileName = f.path.slice(NEWS_FOLDER.length + 1);
                const dateMatch = fileName.match(/^(\d{4}-\d{2}-\d{2})[-_]?/);
                return {
                    path: f.path,
                    ext: fileName.split('.').pop().toLowerCase(),
                    dateFromName: dateMatch ? dateMatch[1] : null,
                    fallbackTitle: toTitle(fileName.replace(/^\d{4}-\d{2}-\d{2}[-_]?/, ''))
                };
            }).sort((a, b) => (b.dateFromName || '').localeCompare(a.dateFromName || '') || b.path.localeCompare(a.path));
        }

        function collectQuiz(tree) {
            const files = (tree.tree || []).filter(f => f.type === 'blob' && f.path.startsWith(QUIZ_FOLDER + '/') &&
                /\.json$/i.test(f.path));
            return files.map(f => {
                const fileName = f.path.slice(QUIZ_FOLDER.length + 1);
                const dateMatch = fileName.match(/^(\d{4}-\d{2}-\d{2})/);
                return { path: f.path, date: dateMatch ? dateMatch[1] : fileName.replace(/\.json$/i, '') };
            }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        }

        function linkifyNews(text) {
            let out = esc(text);
            out = out.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
            out = out.replace(/(^|\s)(@[a-zA-Z0-9_]{3,})/g, (m, pre, handle) =>
                `${pre}<a href="https://t.me/${handle.slice(1)}" target="_blank" rel="noopener">${handle}</a>`);
            // lightweight formatting the admin panel's Bold button writes: **text** → <b>text</b>
            out = out.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
            return out;
        }

        async function fetchNewsFeed() {
            if (newsCache || newsLoading) return newsCache;
            newsLoading = true;
            try {
                const items = await Promise.all(newsFiles.slice(0, 120).map(async nf => {
                    try {
                        const res = await fetch(rawUrl(nf.path), { cache: 'no-store' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        if (nf.ext === 'json') {
                            const data = await res.json();
                            return {
                                path: nf.path,
                                title: data.title || nf.fallbackTitle,
                                body: data.body || '',
                                date: data.date || nf.dateFromName,
                                pinned: !!data.pinned,
                                image: normalizeNewsImage(data.image)
                            };
                        }
                        const raw = (await res.text()).replace(/\r\n/g, '\n').trim();
                        const lines = raw.split('\n');
                        let title = nf.fallbackTitle, body = raw;
                        if (lines[0] && lines[0].length < 90) {
                            title = lines[0].replace(/^#+\s*/, '').trim() || title;
                            body = lines.slice(1).join('\n').trim() || raw;
                        }
                        return { path: nf.path, title, body, date: nf.dateFromName, pinned: /^pin(ned)?[-_]/i.test(nf.path.slice(NEWS_FOLDER.length + 1)), image: null };
                    } catch { return null; }
                }));
                newsCache = items.filter(Boolean);
            } catch {
                newsCache = [];
            }
            newsLoading = false;
            return newsCache;
        }

        // A relative "image" value in a news JSON post (as written by the admin panel) is a repo
        // path like "news/images/xyz.jpg" — resolve it to a raw URL. Absolute http(s) URLs pass through.
        function normalizeNewsImage(value) {
            if (!value || typeof value !== 'string') return null;
            if (/^https?:\/\//i.test(value)) return value;
            return rawUrl(value);
        }

        function newsCardHTML(item, idx) {
            const dateLabel = item.date ? new Date(item.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
            const mediaHTML = item.image
                ? `<div class="news-card-media" onclick="openNewsImage('${esc(item.image)}')"><img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy" onerror="this.closest('.news-card-media').style.display='none'" /></div>`
                : '';
            if (item.path) (window._newsItemsByPath || (window._newsItemsByPath = {}))[item.path] = item;
            const on = item.path ? isBookmarked(item.path) : false;
            const saveBtn = item.path ? `
                <button class="nc-save-btn${on ? ' on' : ''}" title="Save for later" onclick='event.stopPropagation(); toggleNewsBookmark(${JSON.stringify(item.path)}, this);'>
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </button>` : '';
            return `
                <div class="news-card${item.pinned ? ' pinned' : ''}">
                    <div class="news-card-chan">
                        <div class="nc-avatar">M</div>
                        <div class="nc-chan-meta">
                            <div class="nc-chan-name">Monk Quiz Updates <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg></div>
                        </div>
                        ${item.pinned ? '<span class="news-pin-badge">📌 Pinned</span>' : ''}
                        ${dateLabel ? `<span class="news-card-date">${dateLabel}</span>` : ''}
                        ${saveBtn}
                    </div>
                    ${mediaHTML}
                    <div class="news-card-title">${esc(item.title)}</div>
                    <div class="news-card-body">${linkifyNews(item.body)}</div>
                </div>`;
        }

        function toggleNewsBookmark(path, btnEl) {
            const item = (window._newsItemsByPath || {})[path];
            const meta = { type: 'news', path, title: item ? item.title : path, date: item ? item.date : null, image: item ? item.image : null, body: item ? (item.body || '').slice(0, 400) : '' };
            const on2 = toggleBookmark(path, meta);
            if (btnEl) btnEl.classList.toggle('on', on2);
            toast(on2 ? 'Saved' : 'Removed');
        }

        function openNewsImage(url) {
            const box = document.createElement('div');
            box.className = 'news-lightbox';
            box.onclick = (e) => { if (e.target === box) closeNewsImage(); };
            box.innerHTML = `<div class="news-lightbox-close" onclick="closeNewsImage()"><i class="fas fa-xmark"></i></div><img src="${esc(url)}" alt="" />`;
            document.body.appendChild(box);
            document.body.style.overflow = 'hidden';
            window._newsLightbox = box;
        }
        function closeNewsImage() {
            if (window._newsLightbox) { window._newsLightbox.remove(); window._newsLightbox = null; }
            document.body.style.overflow = '';
        }

        async function renderNewsFeed() {
            const el = document.getElementById('newsFeedList');
            if (!el) return;
            if (newsFiles.length === 0) {
                el.innerHTML = `<div class="news-empty">No updates posted yet. New notes &amp; exam alerts will show up here.</div>`;
                return;
            }
            const items = await fetchNewsFeed();
            const liveEl = document.getElementById('newsFeedList');
            if (!liveEl) return; // user navigated away while loading
            window._newsAllItems = items || [];
            if (!items || items.length === 0) {
                liveEl.innerHTML = `<div class="news-empty">No updates posted yet. New notes &amp; exam alerts will show up here.</div>`;
                return;
            }

        function filterNewsFeed(query) {
            const liveEl = document.getElementById('newsFeedList');
            if (!liveEl) return;
            const all = window._newsAllItems || [];
            const q = (query || '').trim().toLowerCase();
            const clearBtn = document.getElementById('newsSearchClear');
            if (clearBtn) clearBtn.style.display = q ? 'flex' : 'none';
            let list = all;
            if (q) list = all.filter(i => (i.title || '').toLowerCase().includes(q) || (i.body || '').toLowerCase().includes(q));
            const pinned = list.filter(i => i.pinned);
            const rest = list.filter(i => !i.pinned);
            if (list.length === 0) {
                liveEl.innerHTML = `<div class="news-empty">🔍 “${esc(query)}” se koi update nahi mila.</div>`;
                return;
            }
            const countTag = q ? `<div class="news-search-count">${list.length} result${list.length > 1 ? 's' : ''} for “${esc(query)}”</div>` : '';
            liveEl.innerHTML = countTag + [...pinned, ...rest].map(newsCardHTML).join('');
        }

        /* ─── Home hero banner (rotating latest-update photos) + news ticker ─── */
        async function initHomeHero() {
            clearInterval(window._heroInterval);
            const heroWrap = document.getElementById('homeHeroWrap');
            const tickerWrap = document.getElementById('homeTickerWrap');
            const tickerTrack = document.getElementById('homeTickerTrack');
            if (!heroWrap) return;
            heroWrap.classList.remove('ready');
            heroWrap.classList.add('hh-loading');
            if (!homeConfig) homeConfig = await fetchHomeConfig();
            if (!document.getElementById('homeHeroWrap')) return; // navigated away while loading

            // ticker: whatever the admin has set in the Photos tab — editable anytime, independent of posts
            if (tickerWrap && tickerTrack) {
                const lines = (homeConfig.ticker || []).filter(Boolean);
                if (lines.length) {
                    const joined = lines.map(h => esc(h)).join('&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;');
                    tickerTrack.innerHTML = `<span onclick='navigate(["progress"])'>${joined}</span><span onclick='navigate(["progress"])'>${joined}</span>`;
                    tickerWrap.style.display = 'flex';
                } else {
                    tickerWrap.style.display = 'none';
                }
            }

            // hero: rotating banner using only the photos the admin uploaded for this banner —
            // not tied to individual update posts
            const slides = (homeConfig.banner || []).slice(0, 8);
            if (slides.length === 0) { heroWrap.innerHTML = ''; heroWrap.classList.remove('hh-loading'); return; }

            const AUTOPLAY_MS = 4500; // time each slide stays active — keep dots + interval in sync

            // pre-render every slide as a stacked layer once; transitions then only
            // toggle a class, so both slides exist in the DOM together = true crossfade,
            // no flash/blank frame, no image re-fetch/pop on every rotation.
            heroWrap.innerHTML = `
                <div class="hh-slides">
                    ${slides.map((s, di) => `
                        <div class="home-hero-slide${di === 0 ? ' active' : ''}" data-i="${di}">
                            <img src="${esc(s.image)}" alt="" loading="${di === 0 ? 'eager' : 'lazy'}" draggable="false" />
                            <div class="hh-overlay"></div>
                            ${s.caption ? `<div class="hh-caption">${esc(s.caption)}</div>` : ''}
                        </div>`).join('')}
                </div>
                ${slides.length > 1 ? `<div class="home-hero-dots">${slides.map((s, di) => `<span class="hh-dot${di === 0 ? ' on' : ''}" data-i="${di}"><i></i></span>`).join('')}</div>` : ''}
            `;

            // fit the box exactly to whichever slide's image is active — measured from
            // the image's own real pixel dimensions, so every banner (any size/ratio the
            // admin uploads) always renders 100% of the photo, auto-matched and filled cleanly.
            let readyShown = false;
            const fitHeight = () => {
                // fixed height — box stays perfectly stable across every slide, regardless
                // of each photo's own aspect ratio (object-fit: cover crops cleanly instead)
                const activeImg = heroWrap.querySelector('.home-hero-slide.active img');
                if (!activeImg || !activeImg.naturalWidth) return;
                heroWrap.style.height = '158px';
                if (!readyShown) {
                    readyShown = true;
                    heroWrap.classList.remove('hh-loading');
                    requestAnimationFrame(() => heroWrap.classList.add('ready'));
                }
            };
            heroWrap.querySelectorAll('.home-hero-slide img').forEach((img, di) => {
                if (img.complete && img.naturalWidth) { if (di === 0) fitHeight(); }
                else img.addEventListener('load', () => { if (img.closest('.home-hero-slide').classList.contains('active')) fitHeight(); });
            });
            let resizeTimer;
            const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitHeight, 120); };
            if (window._heroResizeHandler) window.removeEventListener('resize', window._heroResizeHandler);
            window.addEventListener('resize', onResize);
            window._heroResizeHandler = onResize;

            // single slide: no dots, no autoplay, no swipe — just a static tap-through banner
            if (slides.length <= 1) {
                heroWrap.querySelector('.home-hero-slide')?.addEventListener('click', () => navigate(['progress']));
                return;
            }

            let i = 0;
            let paused = false;
            const slideEls = () => heroWrap.querySelectorAll('.home-hero-slide');
            const dotEls = () => heroWrap.querySelectorAll('.hh-dot');

            const setProgress = (idx) => {
                dotEls().forEach((d, di) => {
                    const bar = d.querySelector('i');
                    d.classList.remove('on', 'done');
                    bar.style.transition = 'none';
                    bar.style.transform = 'scaleX(0)';
                    if (di < idx) { d.classList.add('done'); bar.style.transform = 'scaleX(1)'; }
                });
                const activeDot = dotEls()[idx];
                if (!activeDot) return;
                activeDot.classList.add('on');
                const bar = activeDot.querySelector('i');
                void bar.offsetWidth; // force reflow so the transition restarts cleanly
                bar.style.transition = `transform ${AUTOPLAY_MS}ms linear`;
                bar.style.transform = 'scaleX(1)';
            };

            const goTo = (next) => {
                const count = slides.length;
                const target = ((next % count) + count) % count; // wraps cleanly in either direction
                const els = slideEls();
                els[i]?.classList.remove('active');
                els[target]?.classList.add('active');
                i = target;
                setProgress(i);
                fitHeight();
            };

            setProgress(0);

            const tick = () => { if (!paused) goTo(i + 1); };
            window._heroInterval = setInterval(tick, AUTOPLAY_MS);

            // pause the rotation while the user is actively pressing/touching the banner,
            // and whenever the tab isn't visible — small touch that makes it feel considered
            const resume = () => { paused = false; };
            heroWrap.addEventListener('pointerleave', resume);
            heroWrap.addEventListener('pointercancel', resume); // e.g. an incoming call interrupts the touch mid-press

            const onVisibility = () => { paused = document.hidden; };
            if (window._heroVisibilityHandler) document.removeEventListener('visibilitychange', window._heroVisibilityHandler);
            document.addEventListener('visibilitychange', onVisibility);
            window._heroVisibilityHandler = onVisibility;

            // tapping a progress dot jumps straight to that slide
            dotEls().forEach(d => d.addEventListener('click', (e) => {
                e.stopPropagation();
                const target = parseInt(d.dataset.i, 10);
                if (target !== i) goTo(target);
            }));

            // swipe left/right to move between slides — a genuine tap (no meaningful drag)
            // still opens the banner's link, so both gestures coexist naturally.
            const SWIPE_THRESHOLD = 40;
            let dragging = false, startX = 0, startY = 0, dx = 0, lockedAxis = null;
            heroWrap.addEventListener('pointerdown', (e) => {
                paused = true;
                dragging = true; dx = 0; lockedAxis = null;
                startX = e.clientX; startY = e.clientY;
            });
            heroWrap.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (!lockedAxis) lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            });
            heroWrap.addEventListener('pointerup', () => {
                if (dragging && lockedAxis === 'x' && Math.abs(dx) > SWIPE_THRESHOLD) {
                    goTo(dx < 0 ? i + 1 : i - 1);
                } else if (dragging && Math.abs(dx) < 8) {
                    navigate(['progress']); // treated as a tap, not a swipe
                }
                dragging = false;
                resume();
            });
        }

                    <div class="page-head"><div class="page-eyebrow">${esc(subjectName)}</div><h1>Topic-wise PDFs</h1><p>Tap a topic to read it instantly — fast-loading, no download needed</p></div>
                    <div class="progress-mini" style="max-width:340px;margin:0 auto 22px;"><div class="bar"><i style="width:${pct}%"></i></div><span>${readCount}/${notes.length} read</span></div>
                    <div class="test-list">
                        ${notes.map((nt, idx) => {
                            const done = !!read[nt.path];
                            const on = !!bookmarks[nt.path];
                            const isPdf = PDF_EXT_RE.test(nt.path);
                            return `
                            <div class="test-item note-item" onclick='navigate(["notes", "course", ${JSON.stringify(courseName)}, "subject", ${JSON.stringify(subjectName)}, "pdf", ${String(idx)}])'>
                                <div class="test-item-top">
                                    <div class="test-item-icon">${ICON_NOTE}</div>
                                    <div class="test-info">
                                        <h3>${esc(nt.name)}</h3>
                                        <div class="test-meta">
                                            <span>${isPdf ? '📕 PDF Notes' : '📄 Reference File'}</span>
                                            ${done ? '<span class="read-chip">✓ Read</span>' : ''}
                                        </div>
                                    </div>
                                    <button class="star-btn${on ? ' on' : ''}" title="Save for later" onclick='event.stopPropagation(); toggleBookmark(${JSON.stringify(nt.path)}, {type:"note", course:${JSON.stringify(courseName)}, subject:${JSON.stringify(subjectName)}, index:${String(idx)}, name:${JSON.stringify(nt.name)}}); this.classList.toggle("on"); toast(this.classList.contains("on") ? "Saved" : "Removed");'>
                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                                    </button>
                                </div>
                                <button class="btn-primary btn-block" onclick='event.stopPropagation(); navigate(["notes", "course", ${JSON.stringify(courseName)}, "subject", ${JSON.stringify(subjectName)}, "pdf", ${String(idx)}])'>${done ? 'Read Again' : 'Read Now'} ${ICON_CHEVRON}</button>
                            </div>`;
                        }).join('')}
                    </div>`;
            }
            document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}${body}</div>`;
        }

        function renderPdfView(courseName, subjectName, noteIndex) {
            const course = courses[courseName];
            const subj = course && course.subjects[subjectName];
            const notes = subj ? subj.notes : [];
            const note = notes[parseInt(noteIndex)];
            const crumbs = crumbsHTML([
                { label: 'Home', segments: [] },
                { label: 'Notes', segments: ['notes'] },
                { label: courseName, segments: ['notes', 'course', courseName] },
                { label: subjectName, segments: ['notes', 'course', courseName, 'subject', subjectName] },
                { label: note ? note.name : 'PDF', segments: [] }
            ]);
            if (!note) {
                document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('❓', 'File not found', '')}</div>`;
                return;
            }
            const backSegments = ['notes', 'course', courseName, 'subject', subjectName];
            const isPdf = PDF_EXT_RE.test(note.path);
            markNoteRead(note.path);
            document.body.classList.add('fullscreen-test-mode');
            const on = isBookmarked(note.path);
            const bookmarkMeta = JSON.stringify({ type: 'note', course: courseName, subject: subjectName, index: parseInt(noteIndex), name: note.name });

            if (!isPdf && (note.ext === 'html' || note.ext === 'htm')) {
                // Non-PDF study file (custom HTML note) — same trusted-blob loading path as HTML tests.
                document.getElementById('content').innerHTML = `<div class="view">${crumbs}
                    <div class="quiz-loading"><div class="spinner"></div>Loading…</div></div>`;
                fetch(rawUrl(note.path), { cache: 'no-store' })
                    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
                    .then(htmlText => {
                        const blobUrl = URL.createObjectURL(new Blob([htmlText], { type: 'text/html' }));
                        document.getElementById('content').innerHTML = pdfShellHTML(note.name, backSegments, on, bookmarkMeta) +
                            `<div class="html-test-frame-wrap fullscreen"><iframe class="html-test-frame" src="${blobUrl}" title="${esc(note.name)}" loading="eager"></iframe></div>`;
                    })
                    .catch(err => {
                        document.body.classList.remove('fullscreen-test-mode');
                        document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('⚠️', 'Could not load file', esc(err.message), true)}</div>`;
                    });
                return;
            }

            if (!isPdf) {
                document.body.classList.remove('fullscreen-test-mode');
                document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('📄', note.name, 'This file opens outside the reader.')}
                    <div style="text-align:center;margin-top:-8px;"><a class="btn-outline" style="padding:9px 22px;border-radius:var(--radius-sm);display:inline-block;" href="${rawUrl(note.path)}" target="_blank" rel="noopener">Open File →</a></div></div>`;
                return;
            }

            document.getElementById('content').innerHTML = pdfShellHTML(note.name, backSegments, on, bookmarkMeta) + `
                <div class="html-test-frame-wrap fullscreen pdf-mode">
                    <div class="pdf-loading-overlay" id="pdfLoadingOverlay"><div class="spinner"></div>Loading PDF…</div>
                    <div class="pdf-reader-frame-wrap">
                        <iframe class="pdf-reader-iframe" src="${pdfViewerUrl(note.path)}" title="${esc(note.name)}" loading="eager" onload="hidePdfOverlay()"></iframe>
                    </div>
                    <div class="pdf-fallback-strip">Not loading? <a href="${rawUrl(note.path)}" target="_blank" rel="noopener">Open PDF directly</a> · <a href="${rawUrl(note.path)}" download>Download</a></div>
                </div>`;
            // Safety net: some networks/extensions can block the onload signal from a cross-origin
            // iframe, so force the overlay away after a few seconds regardless.
            clearTimeout(window._pdfOverlayTimer);
            window._pdfOverlayTimer = setTimeout(hidePdfOverlay, 4000);
            pushRecent({ course: courseName, subject: subjectName, section: 'notes', index: parseInt(noteIndex), name: note.name, path: note.path });
        }

        function hidePdfOverlay() {
            const o = document.getElementById('pdfLoadingOverlay');
            if (!o) return;
            o.style.opacity = '0';
            setTimeout(() => { const el = document.getElementById('pdfLoadingOverlay'); if (el) el.remove(); }, 300);
        }

        function pdfShellHTML(title, backSegments, bookmarked, bookmarkMetaJSON) {
            return `
                <div class="fs-back-bar">
                    <button class="fs-back-btn" onclick='navigate(${JSON.stringify(backSegments)})' aria-label="Back">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>Back</span>
                    </button>
                    <span class="fs-title">${esc(title)}</span>
                    <div class="fs-actions">
                        <button class="fs-icon-btn${bookmarked ? ' on' : ''}" id="pdfStarBtn" title="Save for later" onclick='const on2=toggleBookmarkFromMeta(${bookmarkMetaJSON}); this.classList.toggle("on", on2); toast(on2 ? "Saved" : "Removed");'>
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </button>
                    </div>
                </div>`;
        }

        function toggleBookmarkFromMeta(meta) {
            const course = courses[meta.course];
            const subj = course && course.subjects[meta.subject];
            const item = subj && subj.notes[meta.index];
            if (!item) return false;
            return toggleBookmark(item.path, meta);
        }

        /* ─── TEST → QUIZ INTERFACE ─── */
        function renderTestView(courseName, subjectName, testIndex) {
            const course = courses[courseName];
            const subj = course && course.subjects[subjectName];
            const tests = subj ? subj.tests : [];
            const test = tests[parseInt(testIndex)];
            const trail = [
                { label: 'Home', segments: [] },
                { label: courseName, segments: ['course', courseName] },
                { label: subjectName, segments: ['course', courseName, 'subject', subjectName] },
                { label: test ? test.name : 'Test', segments: [] }
            ];
            if (!test) {
                document.getElementById('content').innerHTML =
                    `<div class="view">${crumbsHTML(trail)}${stateBlock('❓','Test not found','')}</div>`;
                return;
            }
            const crumbs = crumbsHTML(trail);
            window._testMeta = { courseName, subjectName, testIndex, testName: test.name, path: test.path };

            if (test.ext === 'html' || test.ext === 'htm') {
                // Fully custom-designed HTML test — fetch it ourselves and load it as a Blob so the
                // browser is guaranteed to treat it as real HTML (never as plain-text source code),
                // regardless of what Content-Type any CDN happens to send.
                document.body.classList.add('fullscreen-test-mode');
                document.getElementById('content').innerHTML = `<div class="view">${crumbs}
                    <div class="quiz-loading"><div class="spinner"></div>Loading test…</div></div>`;
                markAttempted(test.path);
                const backSegments = ['course', courseName, 'subject', subjectName];
                fetch(rawUrl(test.path), { cache: 'no-store' })
                    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
                    .then(htmlText => {
                        const blobUrl = URL.createObjectURL(new Blob([htmlText], { type: 'text/html' }));
                        document.getElementById('content').innerHTML = `
                            <div class="fs-back-bar">
                                <button class="fs-back-btn" onclick='navigate(${JSON.stringify(backSegments)})' aria-label="Back">
                                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <span>Back to Website</span>
                                </button>
                            </div>
                            <div class="html-test-frame-wrap fullscreen">
                                <iframe class="html-test-frame" src="${blobUrl}" title="${esc(test.name)}" loading="eager"></iframe>
                            </div>`;
                    })
                    .catch(err => {
                        document.body.classList.remove('fullscreen-test-mode');
                        document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('⚠️', 'Could not load test', esc(err.message), true)}</div>`;
                    });
                return;
            }

            if (test.ext !== 'json') {
                // Legacy note/pdf-style file: no structured quiz data, offer to open it directly
                document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('📄', test.name, 'This file opens outside the quiz engine.')}
                    <div style="text-align:center;margin-top:-8px;"><a class="btn-outline" style="padding:9px 22px;border-radius:var(--radius-sm);display:inline-block;" href="${rawUrl(test.path)}" target="_blank" rel="noopener">Open File →</a></div></div>`;
                markAttempted(test.path);
                return;
            }

            document.getElementById('content').innerHTML = `<div class="view">${crumbs}
                <div class="quiz-loading"><div class="spinner"></div>Loading test…</div></div>`;

            fetch(rawUrl(test.path), { cache: 'no-store' })
                .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                .then(data => {
                    if (!data.questions || data.questions.length === 0) throw new Error('This test has no questions yet');
                    initQuizEngine(data, crumbs);
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `<div class="view">${crumbs}${stateBlock('⚠️', 'Could not load test', esc(err.message), true)}</div>`;
                });
        }

        /* ─── QUIZ ENGINE (real data, admin-panel feature parity) ─── */
        const QZ = {
            title: '', timeLimit: 60, negativeMark: 0, questions: [], answers: [], bookmarks: [],
            timePerQ: [], current: 0, submitted: false, reviewMode: false, fontLevel: 0,
            qStart: null, endTime: null, timerInterval: null, crumbsHTML: ''
        };

        function shuffleArr(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
            return a;
        }

        function initQuizEngine(data, crumbs) {
            QZ.title = data.title || window._testMeta.testName;
            QZ.timeLimit = data.timeLimit || 60;
            QZ.negativeMark = data.negativeMark || 0;
            QZ.hideQuestionNumber = !!data.hideQuestionNumber;
            let qs = data.questions.map(q => ({ ...q, question: (q.question != null ? q.question : q.text) || '', options: [...q.options] }));
            if (data.shuffleQuestions) qs = shuffleArr(qs);
            if (data.shuffleOptions) {
                qs = qs.map(q => {
                    const order = shuffleArr(q.options.map((_, i) => i));
                    return { ...q, options: order.map(i => q.options[i]), correctIndex: order.indexOf(q.correctIndex) };
                });
            }
            QZ.questions = qs;
            QZ.answers = Array(qs.length).fill(null);
            QZ.bookmarks = Array(qs.length).fill(false);
            QZ.timePerQ = Array(qs.length).fill(0);
            QZ.current = 0;
            QZ.submitted = false;
            QZ.reviewMode = false;
            QZ.fontLevel = 0;
            QZ.bold = false;
            try { QZ.muted = localStorage.getItem('quizSoundMuted') === '1'; } catch (e) { QZ.muted = false; }
            QZ.qStart = Date.now();
            QZ.endTime = Date.now() + QZ.timeLimit * 60000;
            QZ.crumbsHTML = crumbs;

            // Per-test brand colours — same fields the admin panel saves (accentColor / headerColor1 / headerColor2)
            const tbVars = `--tb-tiger-500:${data.accentColor || '#f59e0b'};--tb-navy-950:${data.headerColor1 || '#0b1220'};--tb-navy-900:${data.headerColor1 || '#0f1e33'};--tb-navy-800:${data.headerColor2 || '#14284a'};`;

            const wm = data.watermark;
            const watermarkHTML = (wm && wm.enabled && wm.text) ?
                `<div class="quiz-watermark" style="font-size:${wm.size || 26}px;opacity:${wm.opacity != null ? wm.opacity : 0.14};left:${wm.x != null ? wm.x : 50}%;top:${wm.y != null ? wm.y : 50}%;">${esc(wm.text)}</div>` : '';

            document.getElementById('content').innerHTML = `<div class="view">${crumbs}
                ${watermarkHTML}
                <audio id="qzClickSound" src="https://assets.mixkit.co/active_storage/sfx/269/269.wav" preload="auto"></audio>
                <audio id="qzSwipeSound" src="https://assets.mixkit.co/active_storage/sfx/1897/1897.wav" preload="auto"></audio>
                <audio id="qzCorrectSound" src="https://assets.mixkit.co/active_storage/sfx/2870/2870.wav" preload="auto"></audio>
                <audio id="qzWrongSound" src="https://assets.mixkit.co/active_storage/sfx/2964/2964.wav" preload="auto"></audio>
                <div class="quiz-tb-wrap" style="${tbVars}">
                    <div class="quiz-brand-bar">
                        <div class="qb-brand">
                            <div class="qb-icon"><i class="fas fa-shield-alt"></i></div>
                            <div class="qb-text"><span class="qb1">SI 2021</span><span class="qb2">TIGERS BATCH</span></div>
                        </div>
                        <div class="qb-actions">
                            <a href="https://t.me/Abc5dyz" target="_blank" rel="noopener" class="qb-telegram"><i class="fab fa-telegram-plane"></i> <span>Join Telegram</span></a>
                            <a href="https://www.instagram.com/ras2023discussion_group?igsh=MTliMDFlNjBrOTI=" target="_blank" rel="noopener" class="qb-instagram"><i class="fab fa-instagram"></i> <span>Follow</span></a>
                            <button class="qb-mute" id="quizMuteBtn" onclick="toggleQuizMute()" title="Mute / Unmute sounds"><i class="fas ${QZ.muted ? 'fa-volume-mute' : 'fa-volume-up'}" id="quizMuteIcon"></i></button>
                        </div>
                    </div>
                    <div class="quiz-container">
                        <div class="quiz-toolbar">
                            <span class="qt-counter" id="quizQCounter">Question 1 / ${QZ.questions.length}</span>
                            <div class="qt-controls">
                                <button onclick="changeQuizFont(-1)" title="Decrease text size">A−</button>
                                <button onclick="changeQuizFont(1)" title="Increase text size">A+</button>
                                <span class="qt-sep"></span>
                                <button id="quizBoldBtn" onclick="toggleQuizBold()" title="Bold text"><b>B</b></button>
                            </div>
                        </div>

                        <div id="quizQuestions"></div>

                        <div class="quiz-palette" id="quizPalette"></div>

                        <div class="quiz-actionbar">
                            <button class="bookmark-toggle" id="bookmarkToggle" onclick="toggleQuizBookmark()">☆ <span>Flag for review</span></button>
                            <div class="nav-btns">
                                <button class="prev" id="qPrevBtn" onclick="navQuizQuestion(-1)">← <span>Prev</span></button>
                                <button class="next" id="qNextBtn" onclick="navQuizQuestion(1)"><span>Next</span> →</button>
                            </div>
                            <button class="submit-btn" onclick="submitQuizEngine()">Submit</button>
                        </div>
                    </div>
                </div>
                <div id="resultWrap" style="margin-top:16px;"></div>
            </div>`;

            renderPalette();
            renderQuizQuestion(0);
            startQuizTimer();
            markAttempted(window._testMeta.path);
            pushRecent({ course: window._testMeta.courseName, subject: window._testMeta.subjectName, section: 'tests',
                index: parseInt(window._testMeta.testIndex), name: window._testMeta.testName, path: window._testMeta.path });
        }

        function qzPlaySound(id) {
            if (QZ.muted) return;
            const el = document.getElementById(id);
            if (!el) return;
            try { el.currentTime = 0; el.play().catch(() => {}); } catch (e) {}
        }
        window.toggleQuizMute = function() {
            QZ.muted = !QZ.muted;
            const icon = document.getElementById('quizMuteIcon');
            if (icon) icon.className = QZ.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            try { localStorage.setItem('quizSoundMuted', QZ.muted ? '1' : '0'); } catch (e) {}
        };
        window.toggleQuizBold = function() {
            QZ.bold = !QZ.bold;
            const btn = document.getElementById('quizBoldBtn');
            if (btn) btn.classList.toggle('active', QZ.bold);
            applyQuizFont();
        };

        function renderPalette() {
            const el = document.getElementById('quizPalette');
            if (!el) return;
            el.innerHTML = QZ.questions.map((q, i) => {
                let cls = 'qp-box';
                if (QZ.submitted) {
                    if (QZ.answers[i] === null) cls += '';
                    else cls += (QZ.answers[i] === q.correctIndex ? ' correct' : ' incorrect');
                } else if (QZ.answers[i] !== null) cls += ' answered';
                if (i === QZ.current) cls += ' current';
                if (QZ.bookmarks[i]) cls += ' bookmarked';
                return `<div class="${cls}" onclick="goToQuizQuestion(${i})">${i + 1}</div>`;
            }).join('');
        }

        function renderQuizQuestion(idx) {
            QZ.current = idx;
            const q = QZ.questions[idx];
            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            const selected = QZ.answers[idx];
            const optionsHTML = q.options.map((opt, oi) => {
                let cls = 'option';
                if (QZ.submitted) {
                    cls += ' disabled';
                    if (oi === q.correctIndex) cls += ' correct';
                    else if (oi === selected) cls += ' incorrect';
                } else if (oi === selected) cls += ' selected';
                return `<div class="${cls}" ${QZ.submitted ? '' : `onclick="selectQuizOption(${oi})"`}>
                    <span class="letter">${letters[oi]}</span>
                    <span class="label">${esc(opt)}</span>
                </div>`;
            }).join('');
            const explanationHTML = (QZ.submitted && q.explanation) ?
                `<div class="quiz-explanation"><b>Explanation:</b> ${esc(q.explanation)}</div>` : '';
            const qPrefix = QZ.hideQuestionNumber ? '' : `Q${idx + 1}. `;
            document.getElementById('quizQuestions').innerHTML = `
                <div class="quiz-question">
                    <div class="q-text">${qPrefix}${esc(cleanQText(q.question))}</div>
                    <div class="quiz-options">${optionsHTML}</div>
                    ${explanationHTML}
                </div>`;
            applyQuizFont();
            const counterEl = document.getElementById('quizQCounter');
            if (counterEl) counterEl.textContent = `Question ${idx + 1} / ${QZ.questions.length}`;
            const bmBtn = document.getElementById('bookmarkToggle');
            if (bmBtn) {
                bmBtn.classList.toggle('active', QZ.bookmarks[idx]);
                bmBtn.innerHTML = QZ.bookmarks[idx] ? '★ <span>Flagged</span>' : '☆ <span>Flag for review</span>';
                bmBtn.style.display = QZ.submitted ? 'none' : 'flex';
            }
            document.getElementById('qPrevBtn').style.opacity = idx === 0 ? '0.4' : '1';
            document.getElementById('qNextBtn').innerHTML = idx === QZ.questions.length - 1 ? (QZ.submitted ? '<span>Latest</span> →' : '<span>Next</span> →') : '<span>Next</span> →';
            renderPalette();
        }

        window.selectQuizOption = function(oi) {
            if (QZ.submitted) return;
            if (QZ._advanceTimer) { clearTimeout(QZ._advanceTimer); QZ._advanceTimer = null; }
            QZ.answers[QZ.current] = oi;
            qzPlaySound('qzClickSound');
            renderQuizQuestion(QZ.current);
            updateAttemptBadge();
            // Auto-advance to next question shortly after an option is picked
            const isLast = QZ.current === QZ.questions.length - 1;
            if (!isLast) {
                const thisQ = QZ.current;
                QZ._advanceTimer = setTimeout(() => {
                    QZ._advanceTimer = null;
                    // Only advance if still on the same question and still selected
                    if (!QZ.submitted && QZ.current === thisQ && QZ.answers[thisQ] === oi) {
                        recordTimeSpent();
                        renderQuizQuestion(thisQ + 1);
                    }
                }, 500);
            }
        };

        window.goToQuizQuestion = function(i) {
            recordTimeSpent();
            qzPlaySound('qzSwipeSound');
            renderQuizQuestion(i);
        };

        window.navQuizQuestion = function(dir) {
            const newIdx = QZ.current + dir;
            if (newIdx < 0 || newIdx >= QZ.questions.length) return;
            recordTimeSpent();
            qzPlaySound('qzSwipeSound');
            renderQuizQuestion(newIdx);
        };

        function recordTimeSpent() {
            const now = Date.now();
            QZ.timePerQ[QZ.current] += (now - QZ.qStart) / 1000;
            QZ.qStart = now;
        }

        window.toggleQuizBookmark = function() {
            QZ.bookmarks[QZ.current] = !QZ.bookmarks[QZ.current];
            renderQuizQuestion(QZ.current);
        };

        function updateAttemptBadge() {
            const answered = QZ.answers.filter(a => a !== null).length;
            const badge = document.getElementById('attemptBadge');
            if (badge) badge.textContent = `${answered} / ${QZ.questions.length} answered`;
        }

        window.changeQuizFont = function(delta) {
            QZ.fontLevel = Math.max(-4, Math.min(6, QZ.fontLevel + delta));
            applyQuizFont();
        };
        function applyQuizFont() {
            const step = QZ.fontLevel * 0.05;
            const qSize = Math.max(0.74, Math.min(1.3, 0.92 + step)).toFixed(2);
            const optSize = Math.max(0.68, Math.min(1.12, 0.82 + step)).toFixed(2);
            const weight = QZ.bold ? '700' : '';
            document.querySelectorAll('.quiz-question .q-text').forEach(el => { el.style.fontSize = qSize + 'rem'; el.style.fontWeight = weight; });
            document.querySelectorAll('.quiz-options .label').forEach(el => { el.style.fontSize = optSize + 'rem'; el.style.fontWeight = weight; });
        }

        function startQuizTimer() {
            if (QZ.timerInterval) clearInterval(QZ.timerInterval);
            const duration = QZ.timeLimit * 60000;
            const tick = () => {
                const left = QZ.endTime - Date.now();
                const timerEl = document.getElementById('quizTimer');
                const fillEl = document.getElementById('quizProgressFill');
                if (left <= 0) {
                    clearInterval(QZ.timerInterval);
                    if (timerEl) timerEl.textContent = '⏱ 00:00';
                    toast('⏰ Time is up! Auto-submitting…');
                    submitQuizEngine();
                    return;
                }
                const mins = Math.floor(left / 60000).toString().padStart(2, '0');
                const secs = Math.floor((left % 60000) / 1000).toString().padStart(2, '0');
                if (timerEl) { timerEl.textContent = `⏱ ${mins}:${secs}`; timerEl.classList.toggle('danger', left < duration * 0.15); }
                if (fillEl) {
                    fillEl.style.width = `${(left / duration) * 100}%`;
                    fillEl.className = 'quiz-progress-fill' + (left < duration * 0.15 ? ' danger' : left < duration * 0.35 ? ' warn' : '');
                }
            };
            tick();
            QZ.timerInterval = setInterval(tick, 1000);
        }

        window.submitQuizEngine = function() {
            if (QZ.submitted) return;
            clearInterval(QZ.timerInterval);
            recordTimeSpent();
            QZ.submitted = true;
            let correct = 0, incorrect = 0, unattempted = 0, negTotal = 0;
            QZ.answers.forEach((a, i) => {
                if (a === null) unattempted++;
                else if (a === QZ.questions[i].correctIndex) correct++;
                else { incorrect++; negTotal += QZ.negativeMark; }
            });
            const score = correct - negTotal;
            const pct = Math.round((score / QZ.questions.length) * 100);
            qzPlaySound(pct >= 60 ? 'qzCorrectSound' : 'qzWrongSound');
            document.getElementById('quizPalette').scrollIntoView && null;

            document.getElementById('resultWrap').innerHTML = `
                <div class="quiz-container result-panel">
                    <div class="result-score">${score.toFixed(2)} <span style="font-size:1rem;color:var(--text-muted);">/ ${QZ.questions.length}</span></div>
                    <div class="result-sub">Your Score · ${pct}%</div>
                    <div class="result-stats-grid">
                        <div class="result-stat green"><b>${correct}</b><span>Correct</span></div>
                        <div class="result-stat red"><b>${incorrect}</b><span>Incorrect</span></div>
                        <div class="result-stat orange"><b>${unattempted}</b><span>Skipped</span></div>
                        <div class="result-stat"><b>−${negTotal.toFixed(2)}</b><span>Penalty</span></div>
                    </div>
                    <div class="result-charts">
                        <div class="chart-box"><h6>Performance</h6><canvas id="perfChart"></canvas></div>
                        <div class="chart-box"><h6>Time per Question</h6><canvas id="timeChart"></canvas></div>
                    </div>
                    <div class="result-actions">
                        <button class="btn-review" onclick="reviewQuizAnswers()">🔍 View Solutions</button>
                        <a class="btn-back" href="javascript:void(0)" onclick='navigate(["course", ${JSON.stringify(window._testMeta.courseName)}, "subject", ${JSON.stringify(window._testMeta.subjectName)}])'>← Back to tests</a>
                    </div>
                </div>`;

            const perfCtx = document.getElementById('perfChart').getContext('2d');
            new Chart(perfCtx, { type: 'doughnut', data: { labels: ['Correct', 'Incorrect', 'Skipped'],
                datasets: [{ data: [correct, incorrect, unattempted], backgroundColor: ['#16a34a', '#dc2626', '#f59e0b'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } } });

            const timeCtx = document.getElementById('timeChart').getContext('2d');
            new Chart(timeCtx, { type: 'bar', data: { labels: QZ.questions.map((_, i) => 'Q' + (i + 1)),
                datasets: [{ label: 'Seconds', data: QZ.timePerQ.map(t => Math.round(t)), backgroundColor: '#b45309' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true }, x: { ticks: { font: { size: 9 } } } } } });

            addXP(Math.max(0, correct * 5));
            renderQuizQuestion(QZ.current);
            toast(`✅ Test submitted! ${correct}/${QZ.questions.length} correct`);
        };

        window.reviewQuizAnswers = function() {
            QZ.reviewMode = true;
            document.getElementById('resultWrap').style.display = 'none';
            renderQuizQuestion(0);
            document.querySelector('.quiz-container').scrollIntoView({ behavior: 'smooth' });
        };

        /* ─── PROGRESS ─── */
        function latestNewsDate(items) {
            let max = '';
            (items || []).forEach(i => { if (i.date && i.date > max) max = i.date; });
            return max;
        }
        async function refreshUpdatesBadge() {
            const badge = document.getElementById('bnUpdatesBadge');
            if (!badge) return;
            if (!newsFiles || newsFiles.length === 0) { badge.style.display = 'none'; return; }
            const items = await fetchNewsFeed();
            if (!items || !items.length) { badge.style.display = 'none'; return; }
            const latest = latestNewsDate(items);
            const seen = store.get('mt_updates_seen', '');
            badge.style.display = (latest && latest > seen) ? 'block' : 'none';
        }
        function markUpdatesSeen() {
            fetchNewsFeed().then(items => {
                const latest = latestNewsDate(items || []);
                if (latest) store.set('mt_updates_seen', latest);
                const badge = document.getElementById('bnUpdatesBadge');
                if (badge) badge.style.display = 'none';
            });
        }

        /* ─── Daily Quiz (folder-per-day, many quizzes per day) ─── */
        function quizAnsweredMap() { return store.get('mt_quiz_answered', {}); }
        function quizKey(path, idx) { return path + '#' + idx; }

        // fetches + normalizes a day's quiz file — supports both the new { quizzes:[...] }
        // array format and the legacy single-question { question, options, ... } format
        async function fetchQuizDay(fileInfo) {
            if (window._quizDayCache && window._quizDayCache[fileInfo.path]) return window._quizDayCache[fileInfo.path];
            const res = await fetch(rawUrl(fileInfo.path), { cache: 'no-store' });
            if (!res.ok) throw new Error('not found');
            const data = await res.json();
            const quizzes = Array.isArray(data.quizzes) ? data.quizzes : (data.question ? [data] : []);
            const result = { fileInfo, quizzes };
            (window._quizDayCache || (window._quizDayCache = {}))[fileInfo.path] = result;
            return result;
        }

                .then(days => {
                    days = days.filter(d => d.quizzes.length > 0);
                    if (days.length === 0) { renderQuizEmpty(trail); return; }
                    const answered = quizAnsweredMap();
                    let totalCorrect = 0, totalWrong = 0;
                    const body = `
                        <div class="page-head"><div class="page-eyebrow">🎯 Roz naya practice</div><h1>Daily Quiz</h1><p>Din ke hisaab se chuniye — jitni chaho utni quiz khelein</p></div>
                        <div class="subject-list">
                            ${days.map(d => {

                                        <span>${d.quizzes.length} quiz${d.quizzes.length > 1 ? 'zes' : ''}${doneCount ? ` · ✅ ${correct} sahi · ❌ ${wrong} galat` : ''}</span>
                                    </div>
                                    <div class="subject-row-arrow">${ICON_CHEVRON}</div>

                    const scoreBar = (totalCorrect + totalWrong) > 0 ? `

                            <div class="qsb-item ok"><span class="qsb-num">${totalCorrect}</span><span class="qsb-lbl">✅ Sahi</span></div>

                const { quizzes } = await fetchQuizDay(target);

                        <div class="qsb-item ok"><span class="qsb-num">${dayCorrect}</span><span class="qsb-lbl">✅ Sahi</span></div>

                    <div class="test-list">

                                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

        function renderQuizEmpty(trail) {
            document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}<div class="quiz-empty">🎯<br><br>Koi Daily Quiz abhi available nahi hai.<br>Jald hi naya quiz aayega!</div></div>`;
        }

        async function renderDailyQuizDetail(dateParam, idxParam) {
            const idx = parseInt(idxParam, 10) || 0;
            const trail = [{ label: 'Home', segments: [] }, { label: 'Daily Quiz', segments: ['dailyquiz'] }, { label: dateParam || 'Day', segments: ['dailyquiz', dateParam] }, { label: 'Q' + (idx + 1), segments: [] }];
            if (!quizFiles || quizFiles.length === 0) { renderQuizEmpty(trail); return; }
            const target = quizFiles.find(q => q.date === dateParam);
            if (!target) { renderQuizEmpty(trail); return; }
            document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}<div class="quiz-day-card"><div class="quiz-day-body" style="text-align:center;padding:40px 20px;"><div class="spinner" style="width:26px;height:26px;border:3px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:spin 0.8s linear infinite;"></div>Loading quiz…</div></div></div>`;
            try {
                const { quizzes } = await fetchQuizDay(target);
                const data = quizzes[idx];
                if (!data) { renderQuizEmpty(trail); return; }
                window._lastQuizRender = { trail, fileInfo: target, data, idx, total: quizzes.length };
                renderQuizCard(trail, target, data, idx, quizzes.length);
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}${stateBlock('⚠️', 'Could not load quiz', 'Try again in a moment.', false)}</div>`;
            }
        }

        function renderQuizCard(trail, fileInfo, data, idx, total) {
            const isToday = fileInfo.date === todayStr();
            const key = quizKey(fileInfo.path, idx);
            const already = quizAnsweredMap()[key];
            const options = data.options || [];
            (window._quizMetaByPath || (window._quizMetaByPath = {}))[key] = { type: 'quiz', path: fileInfo.path, date: fileInfo.date, index: idx, title: data.question };
            const onSaved = isBookmarked(key);
            const optsHTML = options.map((opt, i) => {
                let cls = '';
                if (already !== undefined) {
                    if (i === data.answer) cls = 'correct';
                    else if (i === already) cls = 'wrong';
                    cls += ' locked';
                }
                const clickAttr = already === undefined ? `onclick='answerDailyQuiz(${JSON.stringify(fileInfo.path)}, ${idx}, ${i})'` : '';
                return `<div class="quiz-opt ${cls.trim()}" ${clickAttr}><span class="qo-letter">${String.fromCharCode(65 + i)}</span><span>${esc(opt)}</span></div>`;
            }).join('');
            let resultHTML = '';
            if (already !== undefined) {
                const won = already === data.answer;
                resultHTML = `<div class="quiz-result-banner ${won ? 'win' : 'lose'}">${won ? '🎉 Sahi jawab! Great job!' : '❌ Galat jawab — sahi answer highlight kiya gaya hai'}</div>`;
                if (data.explanation) resultHTML += `<div class="quiz-explain">${linkifyNews(data.explanation)}</div>`;
                resultHTML += `<button class="btn-primary btn-block quiz-reattempt-btn" onclick='reattemptQuiz(${JSON.stringify(fileInfo.path)}, ${idx})'><i class="fas fa-rotate-right" style="margin-right:6px;"></i>Reattempt Quiz</button>`;
            }
            const navRow = total > 1 ? `<div class="quiz-nav-row">
                    ${idx > 0 ? `<button class="btn-outline-small" onclick='navigate(["dailyquiz", ${JSON.stringify(fileInfo.date)}, ${idx - 1}])'>← Prev</button>` : '<span></span>'}
                    <span class="quiz-nav-count">Q${idx + 1} / ${total}</span>
                    ${idx < total - 1 ? `<button class="btn-outline-small" onclick='navigate(["dailyquiz", ${JSON.stringify(fileInfo.date)}, ${idx + 1}])'>Next →</button>` : '<span></span>'}
                </div>` : '';
            document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}
                <div class="quiz-day-card">
                    <div class="quiz-day-head"><span class="qd-emoji">🎯</span><div><h2>${isToday ? "Today's Daily Quiz" : 'Daily Quiz'}</h2><p>${fileInfo.date ? new Date(fileInfo.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''}${total > 1 ? ` · Q${idx + 1} of ${total}` : ''}</p></div></div>
                    <div class="quiz-day-body">
                        <div class="quiz-question">${esc(data.question || '')}</div>
                        <div class="quiz-options">${optsHTML}</div>
                        ${resultHTML}
                        <div class="quiz-save-row"><button class="nc-save-btn${onSaved ? ' on' : ''}" style="width:auto;border-radius:20px;padding:6px 14px;gap:6px;display:inline-flex;" onclick='toggleQuizBookmark(${JSON.stringify(key)}, this)'><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span style="font-size:0.72rem;font-weight:700;">Save</span></button></div>
                        ${navRow}
                    </div>
                </div>
            </div>`;
        }

        function answerDailyQuiz(path, idx, chosenIdx) {
            const key = quizKey(path, idx);
            const m = quizAnsweredMap();
            if (m[key] !== undefined) return;
            m[key] = chosenIdx;
            store.set('mt_quiz_answered', m);
            const cached = window._lastQuizRender;
            const correct = cached && cached.data && chosenIdx === cached.data.answer;
            if (correct) { addXP(15); burstConfetti(); }
            if (cached) renderQuizCard(cached.trail, cached.fileInfo, cached.data, cached.idx, cached.total);
        }

        function reattemptQuiz(path, idx) {
            const key = quizKey(path, idx);
            const m = quizAnsweredMap();
            delete m[key];
            store.set('mt_quiz_answered', m);
            const cached = window._lastQuizRender;
            if (cached) renderQuizCard(cached.trail, cached.fileInfo, cached.data, cached.idx, cached.total);
            toast('Reattempt karein — options unlock ho gaye');
        }

        function toggleQuizBookmark(key, btnEl) {
            const meta = (window._quizMetaByPath || {})[key] || { type: 'quiz', path: key };
            const on2 = toggleBookmark(key, meta);
            if (btnEl) btnEl.classList.toggle('on', on2);
            toast(on2 ? 'Saved' : 'Removed');
        }

        function burstConfetti() {
            const layer = document.createElement('div');
            layer.className = 'confetti-layer';
            const emojis = ['🌸', '🎉', '✨', '🌺', '⭐', '🎊'];
            for (let i = 0; i < 26; i++) {
                const span = document.createElement('span');
                span.className = 'confetti-piece';
                span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                const angle = Math.random() * Math.PI * 2;
                const dist = 90 + Math.random() * 180;
                span.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
                span.style.setProperty('--ty', (Math.sin(angle) * dist - 60) + 'px');
                span.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                span.style.animationDelay = (Math.random() * 0.15) + 's';
                layer.appendChild(span);
            }
            document.body.appendChild(layer);
            setTimeout(() => layer.remove(), 1500);
        }

        function renderProgressView() {
            const trail = [{ label: 'Home', segments: [] }, { label: 'Updates', segments: [] }];
            const body = `
                <div class="page-head"><div class="page-eyebrow">Straight from the academy</div><h1>Updates</h1><p>Exam alerts, notices &amp; study news</p></div>
                <div class="news-search-bar">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input type="text" id="newsSearchInput" placeholder="Search updates — purani news bhi…" oninput="filterNewsFeed(this.value)" autocomplete="off" />
                    <button id="newsSearchClear" class="news-search-clear" style="display:none;" onclick="document.getElementById('newsSearchInput').value='';filterNewsFeed('');document.getElementById('newsSearchInput').focus();"><i class="fas fa-xmark"></i></button>
                </div>
                <div class="news-feed" id="newsFeedList">
                    <div class="news-empty"><div class="spinner" style="width:22px;height:22px;border:3px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:spin 0.8s linear infinite;"></div>Loading updates…</div>
                </div>
                <div class="daily-quiz-cta" onclick='navigate(["dailyquiz"])'>
                    <div class="dqc-icon">🎯</div>
                    <div class="dqc-text"><h3>Daily Quiz</h3><p>Ek sawaal, roz — apni General Knowledge test karein</p></div>
                    <div class="dqc-arrow">${ICON_CHEVRON}</div>
                </div>
            `;
            document.getElementById('content').innerHTML = `<div class="view">${crumbsHTML(trail)}${body}</div>`;
            renderNewsFeed();
            markUpdatesSeen();
            if (window._pendingNewsSearch) {
                const q = window._pendingNewsSearch;
                window._pendingNewsSearch = null;
                const input = document.getElementById('newsSearchInput');
                if (input) { input.value = q; }
            }
        }

        /* ─── MASTER RENDER ─── */
        function render() {
            const seg = currentRoute();
            setActiveNav('home');
            document.body.classList.remove('fullscreen-test-mode'); // reset — only the html-test branch re-adds it
            if (!loaded) {
                document.getElementById('content').innerHTML = `<div class="view">${skeletons(3)}</div>`;
                return;
            }
            if (seg.length === 0) renderHome();
            else if (seg[0] === 'saved') { renderSavedView();
                setActiveNav('saved'); } else if (seg[0] === 'progress') { renderProgressView();
                setActiveNav('progress'); } else if (seg[0] === 'dailyquiz' && seg.length === 1) { renderDailyQuizDaysView();
                setActiveNav('tests'); } else if (seg[0] === 'dailyquiz' && seg.length === 2) { renderDailyQuizDayView(seg[1]);
                setActiveNav('tests'); } else if (seg[0] === 'dailyquiz' && seg.length === 3) { renderDailyQuizDetail(seg[1], seg[2]);
                setActiveNav('tests'); } else if (seg[0] === 'tests') { renderHome();
                setActiveNav('tests'); } else if (seg[0] === 'notes' && seg.length === 1) { renderNotesHome();
                setActiveNav('notes'); } else if (seg[0] === 'notes' && seg[1] === 'course' && seg.length === 3) {
                renderNotesCourseView(seg[2]); setActiveNav('notes'); }
            else if (seg[0] === 'notes' && seg[1] === 'course' && seg[3] === 'subject' && seg.length === 5) {
                renderNotesSubjectView(seg[2], seg[4]); setActiveNav('notes'); }
            else if (seg[0] === 'notes' && seg[1] === 'course' && seg[3] === 'subject' && seg[5] === 'pdf' && seg.length === 7) {
                renderPdfView(seg[2], seg[4], seg[6]); setActiveNav('notes'); }
            else if (seg[0] === 'course' && seg.length === 2) renderCourseView(seg[1]);
            else if (seg[0] === 'course' && seg[2] === 'subject' && seg.length === 4) renderSubjectView(seg[1], seg[3]);
            else if (seg[0] === 'course' && seg[2] === 'subject' && seg[4] === 'test' && seg.length === 6)
                renderTestView(seg[1], seg[3], seg[5]);
            else {
                document.getElementById('content').innerHTML =
                    `<div class="view">${stateBlock('❓', 'Page not found', 'Go back to Home.')}</div>`;
            }
        }

        updateStreak();
        loadAll();
    </script>
</body>
</html>
