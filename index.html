<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Monk Test — Quiz Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     CONFIG — sirf yahan apna GitHub username/repo change karna hai
     ============================================================ */

  :root{
    --ink:#141210;
    --ink-2:#1c1916;
    --paper:#f1e9d8;
    --paper-dim:#c9bfa8;
    --seal:#b6402c;
    --seal-dim:#8a3222;
    --gold:#c6a15b;
    --moss:#7c9468;
    --line: rgba(198,161,91,0.22);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  ::selection{background:var(--seal);color:var(--paper);}

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }

  /* subtle ink paper-grain texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(198,161,91,0.05), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(182,64,44,0.06), transparent 40%);
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ---------- nav ---------- */
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:44px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:0.02em;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--seal);
    box-shadow:0 0 0 3px rgba(182,64,44,0.18);
  }
  .repo-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--paper-dim);
    background:rgba(198,161,91,0.08);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* ---------- hero ---------- */
  .hero{
    text-align:center;
    padding:20px 0 40px;
  }
  .hero .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0;
    animation:fadeUp .7s ease forwards;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:clamp(2.1rem, 8vw, 3.2rem);
    line-height:1.08;
    margin:14px 0 16px;
    color:var(--paper);
    opacity:0;
    animation:fadeUp .8s ease .1s forwards;
  }
  .hero h1 em{
    font-style:italic;
    color:var(--seal);
    position:relative;
  }
  .hero p{
    max-width:480px;
    margin:0 auto;
    color:var(--paper-dim);
    font-size:0.98rem;
    line-height:1.6;
    opacity:0;
    animation:fadeUp .8s ease .2s forwards;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* the seal / stamp mark — signature element */
  .seal-mark{
    width:86px;height:86px;
    margin:0 auto 18px;
    position:relative;
    opacity:0;
    animation: stampIn .6s cubic-bezier(.2,1.6,.4,1) .5s forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(2.4) rotate(-18deg);}
    60%{opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(-6deg);}
  }
  .seal-mark svg{ width:100%; height:100%; filter:url(#roughen); }

  .stats{
    display:flex;
    justify-content:center;
    gap:34px;
    margin-top:30px;
    opacity:0;
    animation:fadeUp .8s ease .3s forwards;
  }
  .stat b{
    display:block;
    font-family:'Fraunces',serif;
    font-size:1.5rem;
    font-weight:600;
    color:var(--gold);
  }
  .stat span{
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--paper-dim);
  }

  /* ---------- brush divider ---------- */
  .divider{
    display:block;
    width:100%;
    max-width:340px;
    margin:44px auto;
    opacity:0.5;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .search{
    flex:1;
    min-width:180px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    color:var(--paper);
    font-size:0.9rem;
    font-family:'Manrope',sans-serif;
  }
  .search::placeholder{color:var(--paper-dim);}
  .refresh-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper-dim);
    border-radius:10px;
    padding:11px 14px;
    font-size:0.82rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:border-color .2s, color .2s;
  }
  .refresh-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .refresh-btn svg{width:14px;height:14px;}
  .refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- quiz grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:16px;
  }

  .card{
    position:relative;
    background:linear-gradient(155deg, var(--ink-2), #17140f);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
    opacity:0;
    transform:translateY(8px);
    animation:cardIn .5s ease forwards;
    transition:border-color .25s, transform .25s;
  }
  .card:hover{ border-color:var(--gold); transform:translateY(-3px); }
  @keyframes cardIn{ to{opacity:1; transform:translateY(0);} }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card-index{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    color:var(--paper-dim);
    letter-spacing:0.05em;
  }
  .badge-live{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:0.62rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--moss);
    border:1px solid rgba(124,148,104,0.4);
    padding:3px 8px;
    border-radius:20px;
  }
  .badge-live::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--moss);
  }

  .card h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0;
    line-height:1.3;
    color:var(--paper);
  }
  .card .fname{
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    color:var(--paper-dim);
    word-break:break-all;
  }

  .card-open{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:0.82rem;
    color:var(--gold);
    font-weight:600;
  }
  .card-open svg{ width:15px; height:15px; transition:transform .2s; }
  .card:hover .card-open svg{ transform:translateX(3px); }

  /* ---------- states ---------- */
  .state{
    text-align:center;
    padding:60px 20px;
    color:var(--paper-dim);
  }
  .state h3{
    font-family:'Fraunces',serif;
    color:var(--paper);
    font-size:1.3rem;
    margin:14px 0 8px;
  }
  .state p{ font-size:0.9rem; line-height:1.6; max-width:420px; margin:0 auto; }
  .state code{
    font-family:'JetBrains Mono',monospace;
    background:rgba(198,161,91,0.1);
    padding:2px 6px;
    border-radius:5px;
    color:var(--gold);
    font-size:0.85em;
  }

  .skel{
    height:150px;
    border-radius:14px;
    background:linear-gradient(90deg, var(--ink-2) 25%, #221e18 37%, var(--ink-2) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }

  footer{
    text-align:center;
    margin-top:60px;
    padding-top:22px;
    border-top:1px solid var(--line);
    font-size:0.72rem;
    color:var(--paper-dim);
    font-family:'JetBrains Mono',monospace;
  }
  footer a{ color:var(--gold); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .hero .eyebrow,.hero h1,.hero p,.stats,.seal-mark,.card{ opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
  </filter>
</svg>

<div class="wrap">

  <nav class="nav">
    <div class="brand"><span class="dot"></span> MONK · TEST</div>
    <div class="repo-tag" id="repoTag">vishnoiji29 / Monk-Test</div>
  </nav>

  <div class="hero">
    <div class="eyebrow">Daily Practice Log</div>
    <div class="seal-mark">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#b6402c" stroke-width="3"/>
        <circle cx="50" cy="50" r="32" fill="none" stroke="#c6a15b" stroke-width="1.5"/>
        <text x="50" y="58" text-anchor="middle" font-family="Fraunces, serif" font-size="30" font-weight="700" fill="#c6a15b">म</text>
      </svg>
    </div>
    <h1>Practice like a <em>monk</em>.</h1>
    <p>Aapke saare quiz ek hi jagah — seedha GitHub repo se live sync, koi manual update nahi.</p>

    <div class="stats">
      <div class="stat"><b id="statCount">—</b><span>Quizzes</span></div>
      <div class="stat"><b id="statUpdated">—</b><span>Last Synced</span></div>
    </div>
  </div>

  <svg class="divider" viewBox="0 0 340 20" preserveAspectRatio="none">
    <path d="M2 12 Q 40 2, 80 11 T 160 10 T 240 13 T 338 8" fill="none" stroke="#c6a15b" stroke-width="1.6" stroke-linecap="round"/>
  </svg>

  <div class="toolbar">
    <input class="search" id="searchBox" type="text" placeholder="Quiz khojein…" oninput="filterCards(this.value)">
    <button class="refresh-btn" id="refreshBtn" onclick="loadQuizzes(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Refresh
    </button>
  </div>

  <div class="grid" id="grid">
    <div class="skel"></div>
    <div class="skel"></div>
    <div class="skel"></div>
  </div>

  <footer>
    connected to <a href="https://github.com/vishnoiji29/Monk-Test" target="_blank">github.com/vishnoiji29/Monk-Test</a> — auto-sync via GitHub API
  </footer>
</div>

<script>
/* ============================================================
   CONFIG — bas yahan values badalni hain agar repo change ho
   ============================================================ */
const GITHUB_USER   = "vishnoiji29";
const GITHUB_REPO   = "Monk-Test";
const GITHUB_BRANCH = "main";
const QUIZ_FOLDER    = "quizzes";   // is folder ke andar apni quiz .html files rakhein

const grid = document.getElementById('grid');
let allQuizzes = [];

function titleFromFilename(name){
  return name
    .replace(/\.html?$/i,'')
    .replace(/[-_]+/g,' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function cardHTML(item, idx){
  const title = titleFromFilename(item.name);
  const path  = item.path; // relative path, works with GitHub Pages
  return `
    <a class="card" href="${path}" style="animation-delay:${idx*0.05}s" data-name="${title.toLowerCase()}">
      <div class="card-top">
        <span class="card-index">Q${String(idx+1).padStart(2,'0')}</span>
        <span class="badge-live">Live</span>
      </div>
      <h3>${title}</h3>
      <span class="fname">${path}</span>
      <div class="card-open">
        Quiz Start
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </div>
    </a>`;
}

function renderEmpty(){
  grid.innerHTML = `
    <div class="state" style="grid-column:1/-1">
      <div style="font-size:2rem">📜</div>
      <h3>Abhi koi quiz nahi mili</h3>
      <p>Apni quiz HTML files GitHub repo ke <code>${QUIZ_FOLDER}/</code> folder mein upload karein — ye page automatically unhe yahan dikha dega.</p>
    </div>`;
}

function renderError(msg){
  grid.innerHTML = `
    <div class="state" style="grid-column:1/-1">
      <div style="font-size:2rem">⚠️</div>
      <h3>Load nahi ho paaya</h3>
      <p>${msg}</p>
    </div>`;
}

async function fetchFolder(folder){
  const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${folder}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(url, { headers: { 'Accept':'application/vnd.github.v3+json' } });
  if(!res.ok) throw { status: res.status };
  return res.json();
}

async function loadQuizzes(manual){
  const btn = document.getElementById('refreshBtn');
  if(manual) btn.classList.add('spinning');
  grid.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;

  try{
    let items = [];
    try{
      items = await fetchFolder(QUIZ_FOLDER);
    }catch(e){
      // folder not found -> fallback to repo root
      items = await fetchFolder('');
    }

    if(!Array.isArray(items)) items = [];
    allQuizzes = items.filter(i => i.type === 'file' && /\.html?$/i.test(i.name) && i.name.toLowerCase() !== 'index.html');

    document.getElementById('statCount').textContent = allQuizzes.length;
    document.getElementById('statUpdated').textContent = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});

    if(allQuizzes.length === 0){
      renderEmpty();
    }else{
      grid.innerHTML = allQuizzes.map(cardHTML).join('');
    }
  }catch(err){
    if(err && err.status === 403){
      renderError("GitHub API rate limit lag gayi hai. Thodi der baad refresh karein.");
    }else{
      renderError("Repo se data fetch nahi ho paaya. Repo public hai aur naam sahi hai, ye check kar lein.");
    }
  }finally{
    if(manual) setTimeout(()=>btn.classList.remove('spinning'), 400);
  }
}

function filterCards(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display = card.dataset.name.includes(q) ? '' : 'none';
  });
}

loadQuizzes(false);
</script>
</body>
</html>
